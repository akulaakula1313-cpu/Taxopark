function renderSettings(){
  const el = document.getElementById('viewSettings');
  if(!session){
    el.innerHTML = `<div class="empty"><div class="empty-icon">🔒</div>
      <div class="empty-title">Доступ запрещён</div></div>`;
    return;
  }

  const isAdmin = session.type === 'admin';
  const pct = Math.round(state.zoom * 100);

  let profileHTML = '';
  let dangerHTML = '';

  if(isAdmin){
    profileHTML = `
      <div class="settings-section">
        <div class="profile-mini">
          <div class="profile-avatar admin">👑</div>
          <div class="profile-info">
            <div class="profile-name">Администратор</div>
            <div class="profile-role">Полный доступ</div>
          </div>
          <div class="profile-tag admin">ADMIN</div>
        </div>
        <div class="driver-input-wrap">
          <label class="driver-label">🔑 Пароль администратора</label>
          <input class="m-input mono" id="adminPassInput" type="text" value="${escapeHtml(db.adminPass)}">
        </div>
        <div class="hint-mini">Этот пароль даёт полный доступ ко всем данным приложения и позволяет создавать новые профили.</div>
      </div>
    `;
    dangerHTML = `
      <div class="settings-section danger-section">
        <div class="settings-section-head">
          <div class="settings-section-ico">💣</div>
          <div class="settings-section-title">Полный сброс</div>
        </div>
        <button class="btn-clear" id="btnResetAll">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          </svg>
          Удалить ВСЕ данные и профили
        </button>
        <div class="hint-mini" style="text-align:center;margin-top:.5rem">
          Сотрёт всех водителей, все оплаты и все профили. Останется только пароль админа.
        </div>
      </div>
    `;
  } else {
    profileHTML = `
      <div class="settings-section">
        <div class="profile-mini">
          <div class="profile-avatar">${initials(currentUserLabel())}</div>
          <div class="profile-info">
            <div class="profile-name">${escapeHtml(currentUserLabel())}</div>
            <div class="profile-role">Личный профиль</div>
          </div>
          <div class="profile-tag user">USER</div>
        </div>
        <div class="hint-mini">Это ваш личный профиль. Вы видите только свои данные.</div>
      </div>
    `;
    dangerHTML = `
      <div class="settings-section danger-section">
        <div class="settings-section-head">
          <div class="settings-section-ico">⚠️</div>
          <div class="settings-section-title">Опасная зона</div>
        </div>
        <button class="btn-clear" id="btnClearAll">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          </svg>
          Очистить мои данные
        </button>
        <div class="hint-mini" style="text-align:center;margin-top:.5rem">
          Удалит всех ваших водителей, оплаты и выходные.
        </div>
      </div>
    `;
  }

  el.innerHTML = profileHTML + `
    <div class="settings-section">
      <div class="settings-section-head">
        <div class="settings-section-ico">📏</div>
        <div class="settings-section-title">Размер интерфейса</div>
      </div>
      <div class="setting-block">
        <div class="setting-title">Масштаб</div>
        <div class="setting-desc">От 75% (мелко — больше влезает) до 200% (крупно — для плохого зрения)</div>
        <div class="scale-slider-wrap">
          <input type="range" id="zoomRange" min="75" max="200" step="5" value="${pct}">
          <div class="scale-val" id="zoomVal">${pct}%</div>
        </div>
        <div class="scale-marks">
          <span>75%</span><span>100%</span><span>125%</span><span>150%</span><span>175%</span><span>200%</span>
        </div>
        <div class="scale-presets">
          ${[75,100,125,150,175,200].map(v=>`<button data-zoom="${v}" class="${v===pct?'on':''}">${v}%</button>`).join('')}
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-head">
        <div class="settings-section-ico">🎨</div>
        <div class="settings-section-title">Внешний вид</div>
      </div>
      <div class="toggle-row">
        <div>
          <div class="setting-title">Тёмная тема</div>
          <div class="setting-desc">Переключить светлую/тёмную тему</div>
        </div>
        <button class="toggle ${state.theme==='dark'?'on':''}" id="themeToggle" aria-label="Переключить тему"></button>
      </div>
    </div>

    ${dangerHTML}

    <div class="about-box">
      <div class="about-title">SANI</div>
      <div class="about-sub" id="aboutSub">v${APP_VERSION} · ${pct}% · ${state.theme}</div>
    </div>

    <button class="btn btn-danger" id="btnLogout" style="width:100%;margin-bottom:5rem;flex:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:1rem;height:1rem;vertical-align:-2px;margin-right:.35rem">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
      Выйти из аккаунта
    </button>
  `;

  const range = el.querySelector('#zoomRange');
  if(range){
    range.style.setProperty('--pct', ((pct - 75) / (200 - 75) * 100) + '%');
    range.addEventListener('input', e=>{
      const z = applyZoom((+e.target.value)/100);
      const sub = document.getElementById('aboutSub');
      if(sub) sub.textContent = `v${APP_VERSION} · ${Math.round(z*100)}% · ${state.theme}`;
    });
    range.addEventListener('change', e=>{
      const z = applyZoom((+e.target.value)/100);
      showToast('Размер: ' + Math.round(z*100) + '%', 'info');
    });
  }

  el.querySelectorAll('.scale-presets button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const z = applyZoom((+b.dataset.zoom)/100);
      showToast('Размер: ' + Math.round(z*100) + '%', 'info');
    });
  });

  const themeToggle = el.querySelector('#themeToggle');
  if(themeToggle){
    themeToggle.addEventListener('click', ()=>{
      const newTheme = state.theme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
      themeToggle.classList.toggle('on', newTheme === 'dark');
      const sub = document.getElementById('aboutSub');
      if(sub) sub.textContent = `v${APP_VERSION} · ${Math.round(state.zoom*100)}% · ${newTheme}`;
    });
  }

  const ap = el.querySelector('#adminPassInput');
  if(ap){
    ap.addEventListener('input', e=>{
      const v = e.target.value;
      if(!v.trim()){
        e.target.value = db.adminPass;
        showToast('Пароль не может быть пустым','error');
        return;
      }
      const dupUser = Object.values(db.users).find(x => (x.pass||'') === v);
      if(dupUser){
        showToast('Такой пароль занят пользователем','error');
        e.target.style.borderColor = 'var(--rose)';
        return;
      }
      e.target.style.borderColor = '';
      db.adminPass = v;
      saveDb();
    });
  }

  const clearBtn = el.querySelector('#btnClearAll');
  if(clearBtn){
    clearBtn.addEventListener('click', ()=>{
      if(!confirm('Очистить ВСЕ ваши данные (водители, оплаты, выходные)? Это нельзя отменить.')) return;
      const ds2 = dataStore();
      if(ds2){
        ds2.drivers = [];
        ds2.payments = {};
        ds2.holidays = {};
        saveDb();
      }
      state.drivers = [];
      state.payments = {};
      state.holidays = {};
      dirty = false;
      document.getElementById('fabSave').classList.remove('show');
      renderSettings();
      showToast('Все ваши данные очищены','info');
    });
  }

  const resetBtn = el.querySelector('#btnResetAll');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      if(!confirm('УДАЛИТЬ ВСЕ ДАННЫЕ И ВСЕ ПРОФИЛИ?\n\nОстанется только пароль админа.')) return;
      if(!confirm('Точно? Это действие нельзя отменить.')) return;
      const oldPass = db.adminPass;
      db = { adminPass: oldPass, adminData: emptyData(), users: {} };
      saveDb();
      showToast('Всё очищено','info');
      switchTab('adminOverview');
    });
  }

  el.querySelector('#btnLogout').addEventListener('click', ()=>{
    if(dirty && !confirm('Есть несохранённые изменения. Выйти без сохранения?')) return;
    doLogout();
  });
}

function findUnpaid(){
  const items = [];
  const today = new Date(); today.setHours(0,0,0,0);
  const now = new Date();
  const afterCutoff = now.getHours() >= CUTOFF_HOUR;

  if(afterCutoff){
    const k = todayKey();
    state.drivers.forEach((drv,i)=>{
      if(isHoliday(k,i)) return;
      const amt = Number(drv.amount)||0;
      if(amt<=0) return;
      const p = getPay(k,i);
      if(!p || p.sum<amt){
        items.push({key:k, idx:i, name:drv.name||'Без имени', plate:drv.plate||'',
          phone:drv.phone||'', owed:amt-(p?p.sum:0)});
      }
    });
  }

  for(let back=1; back<=7; back++){
    const dt = new Date(today); dt.setDate(dt.getDate()-back);
    const k = keyOfDate(dt);
    state.drivers.forEach((drv,i)=>{
      if(isHoliday(k,i)) return;
      const amt = Number(drv.amount)||0;
      if(amt<=0) return;
      const p = getPay(k,i);
      if(!p || p.sum<amt){
        items.push({key:k, idx:i, name:drv.name||'Без имени', plate:drv.plate||'',
          phone:drv.phone||'', owed:amt-(p?p.sum:0)});
      }
    });
  }
  return items;
}

function checkAndShowAlert(){
  if(state.alertShown || !session || session.type === 'admin') return;
  const items = findUnpaid();
  if(items.length === 0) return;
  state.alertShown = true;

  const sub = document.getElementById('alertSub');
  const list = document.getElementById('alertList');
  sub.textContent = `${items.length} ${items.length===1?'запись':'записей'} · проверьте оплаты`;

  const byDate = {};
  items.forEach(it=>{ (byDate[it.key] = byDate[it.key] || []).push(it); });
  const keys = Object.keys(byDate).sort();

  list.innerHTML = '';
  keys.forEach(k=>{
    const d = new Date(k+'T00:00:00');
    const header = document.createElement('div');
    header.style.cssText = 'font-size:.6rem;font-weight:800;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;padding:.3rem .2rem .1rem';
    header.textContent = `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${k===todayKey()?' · сегодня':''}`;
    list.appendChild(header);

    byDate[k].forEach(it=>{
      const el = document.createElement('div');
      el.className = 'alert-item';
      const hasPhone = it.phone && it.phone.trim();
      el.innerHTML = `
        <div class="alert-item-av">${initials(it.name)}</div>
        <div class="alert-item-info">
          <div class="alert-item-name">${escapeHtml(it.name)}${it.plate?' · '+escapeHtml(it.plate):''}</div>
          <div class="alert-item-meta">Не оплачено: <b>${fmt(it.owed)} ֏</b></div>
        </div>
        ${hasPhone ? `<button class="alert-item-btn" data-call-alert="${it.idx}" aria-label="Позвонить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>` : ''}`;
      list.appendChild(el);
    });
  });

  list.querySelectorAll('[data-call-alert]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); callDriver(+b.dataset.callAlert); });
  });

  document.getElementById('alertModal').classList.add('show');
}

function refreshActiveView(){
  if(!session) return;
  if(state.activeTab === 'today') renderToday();
  else if(state.activeTab === 'month') renderMonth();
  else if(state.activeTab === 'drivers') renderDrivers();
  else if(state.activeTab === 'adminOverview') renderAdminOverview();
  else if(state.activeTab === 'adminProfiles') renderAdminProfiles();
  else if(state.activeTab === 'settings') renderSettings();
}

function switchTab(tab){
  state.activeTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const map = {
    today:'viewToday', month:'viewMonth', drivers:'viewDrivers',
    adminOverview:'viewAdminOverview', adminProfiles:'viewAdminProfiles',
    settings:'viewSettings'
  };
  const view = document.getElementById(map[tab]);
  if(view) view.classList.add('active');

  const isAdmin = session && session.type === 'admin';
  const subText = {
    today:'Сегодня', month:'Месяц', drivers:'Водители',
    adminOverview:'Обзор', adminProfiles:'Профили', settings:'Настройки'
  }[tab] || '';
  document.getElementById('topbarSub').textContent = subText;

  let name = 'SANI';
  if(tab === 'settings') name = 'SANI Настройки';
  else if(isAdmin) name = 'SANI · Админ';
  document.getElementById('topbarName').textContent = name;

  document.getElementById('dayNav').style.display = tab === 'today' ? 'flex' : 'none';
  document.getElementById('main').scrollTop = 0;
  refreshActiveView();
}

function setTheme(t){
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  const sub = document.getElementById('aboutSub');
  if(sub) sub.textContent = `v${APP_VERSION} · ${Math.round(state.zoom*100)}% · ${t}`;
}

function init(){
  loadDb();

  state.theme = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);

  const savedZoom = parseFloat(localStorage.getItem(ZOOM_KEY));
  state.zoom = (!isNaN(savedZoom) && savedZoom>=ZOOM_MIN && savedZoom<=ZOOM_MAX) ? savedZoom : 1;
  applyZoom(state.zoom);

  document.getElementById('fabSave').addEventListener('click', ()=>{
    persist();
    showToast('Сохранено','success');
  });

  document.getElementById('btnQuickTheme').addEventListener('click', ()=>{
    const newTheme = state.theme === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
    if(state.activeTab === 'settings') renderSettings();
  });

  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);
  document.getElementById('userSheetClose').addEventListener('click', closeSheet);

  const authBtn = document.getElementById('authBtn');
  const authPass = document.getElementById('authPass');
  authBtn.addEventListener('click', ()=>{ tryLogin(authPass.value); });
  authPass.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); tryLogin(authPass.value); }
  });
  authPass.addEventListener('input', ()=>{
    document.getElementById('authError').textContent = '';
  });

  document.getElementById('alertClose').addEventListener('click', ()=>{
    document.getElementById('alertModal').classList.remove('show');
  });
  document.getElementById('prevDay').addEventListener('click', ()=>shiftDay(-1));
  document.getElementById('nextDay').addEventListener('click', ()=>shiftDay(1));
  document.getElementById('dayNavCenter').addEventListener('click', goToday);

  window.addEventListener('beforeunload', e=>{
    if(dirty){ e.preventDefault(); e.returnValue = ''; }
  });

  session = restoreSession();
  if(session){
    startApp();
  } else {
    document.getElementById('authScreen').classList.add('show');
    setTimeout(()=>{ try{ authPass.focus(); }catch(e){} }, 300);
  }
}

init();
</script>
