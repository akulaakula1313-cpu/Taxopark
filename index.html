<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-zoom="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SANI · Мобильный</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2310b981'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Ctext x='50' y='78' font-size='82' font-weight='900' text-anchor='middle' fill='%23022c22' font-family='Arial Black, Arial, sans-serif'%3ES%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2310b981'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Ctext x='50' y='78' font-size='82' font-weight='900' text-anchor='middle' fill='%23022c22' font-family='Arial Black, Arial, sans-serif'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  --bg:#020617;--bg-1:#0b1120;--bg-2:#0f172a;
  --surface:#0f172a;--surface-2:#1e293b;--surface-3:#334155;
  --line:rgba(148,163,184,.12);--line-strong:rgba(148,163,184,.22);
  --txt-1:#f8fafc;--txt-2:#cbd5e1;--txt-3:#94a3b8;--txt-4:#64748b;
  --emerald:#10b981;--emerald-bright:#34d399;--cyan:#06b6d4;
  --rose:#f43f5e;--rose-bright:#fb7185;--amber:#f59e0b;--violet:#8b5cf6;
  --zoom: 1;
}
[data-theme="light"] {
  --bg:#f1f5f9;--bg-1:#ffffff;--bg-2:#f8fafc;
  --surface:#ffffff;--surface-2:#f1f5f9;--surface-3:#e2e8f0;
  --line:rgba(15,23,42,.08);--line-strong:rgba(15,23,42,.15);
  --txt-1:#0f172a;--txt-2:#334155;--txt-3:#64748b;--txt-4:#94a3b8;
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--zoom))}
html,body{height:100%;overscroll-behavior-y:none}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt-1);
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden;position:fixed;inset:0;
  transition:background .3s,color .3s}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;max-width:35rem;
  margin:0 auto;position:relative;overflow:hidden;background:var(--bg);font-size:1rem}

.topbar{flex:none;display:flex;align-items:center;gap:.5rem;
  padding:calc(env(safe-area-inset-top) + .5rem) .75rem .5rem;background:var(--bg);
  border-bottom:1px solid var(--line);position:relative;z-index:20}
.topbar-logo{flex:none;width:2.1rem;height:2.1rem;border-radius:.6rem;
  background:linear-gradient(135deg,#10b981,#06b6d4);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px -4px rgba(16,185,129,.65);overflow:hidden}
.topbar-logo svg{width:100%;height:100%;display:block}
.topbar-title{flex:1;min-width:0}
.topbar-name{font-size:1rem;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar-sub{font-size:.6rem;font-weight:600;color:var(--txt-3);font-family:'JetBrains Mono',monospace;margin-top:.05rem}

.clock{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1;margin-right:.4rem}
.clock-time{font-size:.88rem;font-weight:800;font-family:'JetBrains Mono',monospace;letter-spacing:-.02em;color:var(--txt-1)}
.clock-time.warn{color:#fbbf24}
.clock-time.danger{color:var(--rose-bright);animation:blinkTime 1s ease-in-out infinite}
@keyframes blinkTime{0%,100%{opacity:1}50%{opacity:.35}}
.clock-date{font-size:.55rem;font-weight:700;color:var(--txt-4);font-family:'JetBrains Mono',monospace;letter-spacing:.04em;margin-top:.05rem}

.icon-btn{flex:none;width:2.2rem;height:2.2rem;border-radius:.6rem;background:var(--surface-2);
  border:1px solid var(--line);color:var(--txt-2);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .18s ease}
.icon-btn:active{transform:scale(.9);background:var(--surface-3)}
.icon-btn svg{width:1rem;height:1rem}

.day-nav{flex:none;display:flex;align-items:center;gap:.35rem;
  padding:.35rem .6rem;background:var(--bg);border-bottom:1px solid var(--line);z-index:19}
.day-nav-btn{flex:none;width:1.9rem;height:1.9rem;border-radius:.5rem;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.day-nav-btn:active{transform:scale(.88);background:var(--surface-3)}
.day-nav-btn svg{width:.85rem;height:.85rem}
.day-nav-center{flex:1;text-align:center;min-width:0;cursor:pointer;user-select:none;padding:.1rem}
.day-nav-center:active{opacity:.7}
.day-nav-label{font-size:.76rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.day-nav-label.today{color:var(--emerald-bright)}
.day-nav-sub{font-size:.55rem;font-weight:700;color:var(--txt-4);font-family:'JetBrains Mono',monospace;margin-top:.05rem}
.day-nav-sub.today{color:var(--emerald)}

.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;padding-bottom:5rem}
.main::-webkit-scrollbar{display:none}
.view{display:none;padding:.6rem;animation:viewIn .25s ease}
.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.nav{flex:none;display:flex;background:var(--bg);border-top:1px solid var(--line);
  padding:.35rem .35rem calc(env(safe-area-inset-bottom) + .35rem);position:relative;z-index:20}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  padding:.4rem .15rem;border:none;background:transparent;color:var(--txt-4);font-family:inherit;
  font-size:.6rem;font-weight:700;cursor:pointer;border-radius:.65rem;transition:all .18s ease;position:relative}
.nav-btn svg{width:1.15rem;height:1.15rem;transition:transform .2s}
.nav-btn:active svg{transform:scale(.88)}
.nav-btn.active{color:var(--emerald-bright);background:rgba(16,185,129,.1)}

.hero{padding:.7rem .85rem;border-radius:.9rem;
  background:linear-gradient(145deg,var(--surface) 0%,var(--bg-1) 100%);
  border:1px solid var(--line);margin-bottom:.5rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-30%;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(16,185,129,.18),transparent 70%);pointer-events:none}
.hero-date{font-size:.82rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;
  gap:.4rem;position:relative;flex-wrap:wrap}
.hero-badge{font-size:.55rem;font-weight:800;padding:.1rem .35rem;border-radius:.3rem;
  text-transform:uppercase;letter-spacing:.05em}
.hero-badge.holiday{background:rgba(139,92,246,.2);color:#a78bfa;border:1px solid rgba(139,92,246,.4)}
.hero-badge.today{background:rgba(16,185,129,.2);color:var(--emerald-bright);border:1px solid rgba(16,185,129,.4)}
.hero-body{display:flex;align-items:center;gap:.7rem;margin-top:.55rem;position:relative}
.progress-ring{flex:none;width:3rem;height:3rem;position:relative}
.progress-ring svg{transform:rotate(-90deg);width:3rem;height:3rem}
.progress-ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.progress-ring .bg{stroke:var(--surface-3)}
.progress-ring .fg{stroke:var(--emerald);transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.progress-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:'JetBrains Mono',monospace}
.progress-ring-num{font-size:.78rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--txt-1)}
.progress-ring-tot{font-size:.5rem;font-weight:700;color:var(--txt-3);margin-top:.05rem}
.hero-info{flex:1;min-width:0}
.hero-info-main{font-size:.72rem;font-weight:700;color:var(--txt-2);margin-bottom:.15rem}
.hero-info-main b{color:var(--emerald-bright);font-size:.86rem;font-family:'JetBrains Mono',monospace}
.hero-info-sub{font-size:.62rem;color:var(--txt-3);font-weight:600}

.calc{padding:.55rem .75rem;border-radius:.9rem;background:var(--surface);border:1px solid var(--line);
  margin-bottom:.5rem}
.calc-head{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  color:var(--txt-3);margin-bottom:.35rem}
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:.28rem 0;
  border-bottom:1px solid var(--line);font-size:.72rem}
.calc-row:last-child{border-bottom:none;padding-bottom:0}
.calc-row .label{color:var(--txt-2);font-weight:600}
.calc-row .value{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.78rem;color:var(--txt-1)}
.calc-row.green .value{color:var(--emerald-bright)}
.calc-row.red .value{color:var(--rose-bright)}
.calc-row.amber .value{color:#fbbf24}
.calc-row.violet .value{color:#a78bfa}
.calc-row.big{padding-top:.35rem;margin-top:.25rem;border-top:1.5px solid var(--line-strong)}
.calc-row.big .label{font-weight:800;color:var(--txt-1);font-size:.75rem}
.calc-row.big .value{font-size:.86rem}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:.65rem 0 .35rem;padding:0 .15rem}
.section-title{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3)}
.section-count{font-size:.6rem;font-weight:700;color:var(--txt-3);font-family:'JetBrains Mono',monospace}

.pay-list{display:flex;flex-direction:column;gap:.4rem}
.pay-card{display:flex;align-items:center;gap:.35rem;padding:.5rem;border-radius:.8rem;
  background:var(--surface);border:1.5px solid var(--line);
  transition:all .2s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.pay-card.paid{background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(6,182,212,.08));
  border-color:rgba(16,185,129,.45)}
.pay-card.partial{background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.06));
  border-color:rgba(245,158,11,.5)}
.pay-card.warn{background:linear-gradient(135deg,rgba(153,27,27,.28),rgba(69,10,10,.18));
  border-color:rgba(244,63,94,.5)}
.pay-card.warn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--rose);animation:edgePulse 1.4s ease-in-out infinite}
@keyframes edgePulse{0%,100%{opacity:1}50%{opacity:.4}}
.pay-card.overdue{background:linear-gradient(135deg,rgba(153,27,27,.45),rgba(69,10,10,.28));
  border-color:var(--rose);animation:overduePulse 1.2s ease-in-out infinite}
@keyframes overduePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.5);border-color:var(--rose)}
  50%    {box-shadow:0 0 0 6px rgba(244,63,94,0);border-color:var(--rose-bright)}
}
.pay-card.overdue::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--rose-bright);animation:edgePulse 1s ease-in-out infinite}
.pay-card.holiday{opacity:.85;
  background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(139,92,246,.06));
  border-color:rgba(139,92,246,.5)}
.pay-card.holiday::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--violet)}

.pay-main{flex:1;min-width:0;display:flex;align-items:center;gap:.4rem;cursor:pointer;
  user-select:none;transition:transform .15s;padding-right:.1rem}
.pay-main:active{transform:scale(.985)}
.pay-avatar{flex:none;width:1.9rem;height:1.9rem;border-radius:.6rem;display:flex;
  align-items:center;justify-content:center;font-size:.65rem;font-weight:800;
  background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(6,182,212,.14));
  color:var(--emerald-bright);border:1px solid rgba(16,185,129,.3)}
.pay-card.paid .pay-avatar{background:linear-gradient(135deg,#10b981,#06b6d4);color:#022c22;
  border-color:transparent;box-shadow:0 4px 12px -3px rgba(16,185,129,.5)}
.pay-card.partial .pay-avatar{background:linear-gradient(135deg,rgba(245,158,11,.35),rgba(245,158,11,.15));
  color:#fbbf24;border-color:rgba(245,158,11,.5)}
.pay-card.warn .pay-avatar,.pay-card.overdue .pay-avatar{
  background:linear-gradient(135deg,rgba(244,63,94,.35),rgba(153,27,27,.25));
  color:#fca5a5;border-color:rgba(244,63,94,.5)}
.pay-card.holiday .pay-avatar{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(139,92,246,.15));
  color:#a78bfa;border-color:rgba(139,92,246,.5)}
.pay-info{flex:1;min-width:0}
.pay-name{font-size:.76rem;font-weight:700;color:var(--txt-1);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-bottom:.05rem}
.pay-name.empty{color:var(--txt-3);font-weight:600;font-style:italic}
.pay-plate{display:inline-flex;align-items:center;gap:.2rem;font-size:.55rem;font-weight:800;
  font-family:'JetBrains Mono',monospace;letter-spacing:.05em;
  background:var(--surface-2);color:var(--txt-2);padding:.08rem .3rem;border-radius:.25rem;
  border:1px solid var(--line-strong);margin-bottom:.1rem;text-transform:uppercase}
.pay-card.paid .pay-plate{background:rgba(16,185,129,.2);color:var(--emerald-bright);
  border-color:rgba(16,185,129,.4)}
.pay-card.partial .pay-plate{background:rgba(245,158,11,.2);color:#fbbf24;
  border-color:rgba(245,158,11,.4)}
.pay-card.warn .pay-plate,.pay-card.overdue .pay-plate{background:rgba(244,63,94,.2);color:#fca5a5;
  border-color:rgba(244,63,94,.4)}
.pay-card.holiday .pay-plate{background:rgba(139,92,246,.2);color:#a78bfa;border-color:rgba(139,92,246,.4)}
.pay-amount{font-size:.6rem;color:var(--txt-3);font-family:'JetBrains Mono',monospace;font-weight:600;
  display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.pay-amount .sum{color:var(--txt-2);font-weight:700}
.pay-card.paid .pay-amount .sum{color:var(--emerald-bright)}
.pay-card.partial .pay-amount .sum{color:#fbbf24}
.pay-comment{font-size:.58rem;color:var(--txt-3);font-style:italic;margin-top:.08rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pay-card.partial .pay-comment{color:#fcd34d}
.pay-card.holiday .pay-name{color:#c4b5fd}

.pay-actions{flex:none;display:flex;align-items:center;gap:.2rem}
.pay-action{width:2rem;height:2.4rem;border-radius:.55rem;border:1px solid var(--line);
  background:var(--surface-2);color:var(--txt-2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .18s;padding:0;font-family:inherit}
.pay-action:active{transform:scale(.86)}
.pay-action svg{width:.95rem;height:.95rem}
.pay-action.holiday-btn{color:#a78bfa;border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.1)}
.pay-action.holiday-btn.on{background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff;
  border-color:transparent;box-shadow:0 4px 12px -3px rgba(139,92,246,.6)}
.pay-action.call-btn{color:var(--cyan);border-color:rgba(6,182,212,.35);background:rgba(6,182,212,.1)}
.pay-action.call-btn:active{background:linear-gradient(135deg,#06b6d4,#22d3ee);color:#022c22}
.pay-action.call-btn.disabled{opacity:.3;pointer-events:none}
.pay-action.more-btn{color:var(--txt-4)}

.quick-pay{width:2.6rem;height:2.4rem;border-radius:.6rem;border:1.5px solid var(--line-strong);
  background:var(--surface-2);color:var(--txt-3);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);font-family:inherit;padding:0}
.quick-pay svg{width:1.3rem;height:1.3rem;transition:transform .2s}
.quick-pay:active{transform:scale(.86)}
.quick-pay.on{background:linear-gradient(135deg,#10b981,#06b6d4);color:#022c22;border-color:transparent;
  box-shadow:0 4px 14px -4px rgba(16,185,129,.75)}
.quick-pay.partial{background:rgba(245,158,11,.25);color:#fbbf24;border-color:rgba(245,158,11,.55)}
.pay-card.warn .quick-pay,.pay-card.overdue .quick-pay{background:rgba(244,63,94,.2);
  border-color:rgba(244,63,94,.5);color:var(--rose-bright)}
.pay-card.overdue .quick-pay{animation:quickPayPulse 1.2s ease-in-out infinite}
@keyframes quickPayPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.6)}
  50%    {box-shadow:0 0 0 5px rgba(244,63,94,0)}
}
@keyframes qpPop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.quick-pay.on svg{animation:qpPop .35s cubic-bezier(.34,1.56,.64,1)}

@media (max-width:380px){
  .pay-actions{gap:.15rem}
  .pay-action{width:1.85rem;height:2.2rem}
  .pay-action svg{width:.85rem;height:.85rem}
  .quick-pay{width:2.4rem;height:2.2rem}
  .quick-pay svg{width:1.15rem;height:1.15rem}
  .pay-avatar{width:1.75rem;height:1.75rem;font-size:.6rem}
}

/* НАСТРОЙКИ */
.settings-section{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;
  padding:.75rem .85rem;margin-bottom:.55rem}
.settings-section-head{display:flex;align-items:center;gap:.45rem;margin-bottom:.7rem}
.settings-section-ico{flex:none;width:1.5rem;height:1.5rem;border-radius:.4rem;
  display:flex;align-items:center;justify-content:center;font-size:.85rem;
  background:var(--surface-2);border:1px solid var(--line)}
.settings-section-title{font-size:.65rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--txt-3)}

.setting-block{margin-bottom:.85rem}
.setting-block:last-child{margin-bottom:0}
.setting-title{font-size:.85rem;font-weight:800;color:var(--txt-1);margin-bottom:.2rem;letter-spacing:-.01em}
.setting-desc{font-size:.68rem;font-weight:500;color:var(--txt-3);line-height:1.45;margin-bottom:.6rem}

.scale-slider-wrap{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.scale-val{flex:none;min-width:3.6rem;text-align:center;font-family:'JetBrains Mono',monospace;
  font-weight:800;font-size:.85rem;color:var(--emerald-bright);
  background:var(--bg-2);border:1px solid var(--line-strong);border-radius:.5rem;
  padding:.35rem .4rem;letter-spacing:-.02em}
.scale-marks{display:flex;justify-content:space-between;font-size:.58rem;font-weight:700;
  color:var(--txt-4);font-family:'JetBrains Mono',monospace;
  padding:0 .1rem .5rem;letter-spacing:.02em}
.scale-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem}
.scale-presets button{padding:.5rem .2rem;border-radius:.5rem;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);
  font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:800;cursor:pointer;
  transition:all .15s;letter-spacing:-.02em}
.scale-presets button:active{transform:scale(.94);background:var(--surface-3)}
.scale-presets button.on{background:rgba(16,185,129,.18);border-color:rgba(16,185,129,.5);
  color:var(--emerald-bright)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.6rem;
  background:transparent;outline:none;cursor:pointer;flex:1}
input[type=range]::-webkit-slider-runnable-track{height:.4rem;border-radius:999px;
  background:linear-gradient(90deg,var(--emerald) 0%,var(--emerald) var(--pct,50%),var(--surface-3) var(--pct,50%),var(--surface-3) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.2rem;height:1.2rem;
  border-radius:50%;background:#fff;margin-top:-.4rem;
  box-shadow:0 2px 10px rgba(0,0,0,.4);border:3px solid var(--emerald)}
input[type=range]::-moz-range-track{height:.4rem;border-radius:999px;background:var(--surface-3)}
input[type=range]::-moz-range-progress{height:.4rem;border-radius:999px;background:var(--emerald)}
input[type=range]::-moz-range-thumb{width:1.2rem;height:1.2rem;border-radius:50%;
  background:#fff;border:3px solid var(--emerald);box-shadow:0 2px 10px rgba(0,0,0,.4)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:.7rem}
.toggle-row .setting-title{margin-bottom:.15rem}
.toggle-row .setting-desc{margin-bottom:0}
.toggle{flex:none;width:2.9rem;height:1.55rem;border-radius:999px;background:var(--surface-3);
  border:none;cursor:pointer;position:relative;transition:all .25s;padding:0}
.toggle::after{content:'';position:absolute;top:.15rem;left:.15rem;width:1.25rem;height:1.25rem;
  border-radius:50%;background:#fff;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 1px 4px rgba(0,0,0,.35)}
.toggle.on{background:linear-gradient(135deg,#10b981,#06b6d4)}
.toggle.on::after{left:calc(100% - 1.4rem)}

.danger-section{background:rgba(244,63,94,.06);border:1px solid rgba(244,63,94,.3)}
.danger-section .settings-section-ico{background:rgba(244,63,94,.15);border-color:rgba(244,63,94,.3)}
.danger-section .settings-section-title{color:var(--rose-bright)}
.btn-clear{width:100%;padding:.8rem;border-radius:.65rem;border:1.5px solid rgba(244,63,94,.5);
  background:rgba(244,63,94,.1);color:var(--rose-bright);font-family:inherit;
  font-size:.85rem;font-weight:800;cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:.45rem}
.btn-clear:active{transform:scale(.97);background:rgba(244,63,94,.2)}
.btn-clear svg{width:1rem;height:1rem}

.about-box{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;
  padding:1rem;margin-bottom:.55rem;text-align:center}
.about-title{font-size:1.1rem;font-weight:900;letter-spacing:.15em;
  background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.15rem}
.about-sub{font-size:.62rem;color:var(--txt-4);font-weight:600;font-family:'JetBrains Mono',monospace;
  letter-spacing:.02em}

.profile-mini{display:flex;align-items:center;gap:.65rem;padding:.7rem;
  background:var(--bg-2);border-radius:.65rem;border:1px solid var(--line);margin-bottom:.55rem}
.profile-avatar{flex:none;width:2.4rem;height:2.4rem;border-radius:.65rem;
  background:linear-gradient(135deg,#10b981,#06b6d4);color:#022c22;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.profile-avatar.admin{background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:.85rem;font-weight:800;color:var(--txt-1);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.profile-role{font-size:.6rem;font-weight:700;color:var(--txt-3);font-family:'JetBrains Mono',monospace;
  text-transform:uppercase;letter-spacing:.05em;margin-top:.1rem}
.profile-tag{flex:none;font-size:.55rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  padding:.2rem .45rem;border-radius:.35rem}
.profile-tag.admin{background:rgba(139,92,246,.2);color:#a78bfa;border:1px solid rgba(139,92,246,.4)}
.profile-tag.user{background:rgba(6,182,212,.18);color:#22d3ee;border:1px solid rgba(6,182,212,.4)}

/* АДМИН */
.admin-user-card{padding:.65rem .7rem;border-radius:.75rem;background:var(--bg-2);
  border:1px solid var(--line);margin-bottom:.45rem}
.admin-user-top{display:flex;align-items:center;gap:.55rem;margin-bottom:.55rem}
.admin-user-avatar{flex:none;width:2.3rem;height:2.3rem;border-radius:.6rem;
  background:linear-gradient(135deg,#06b6d4,#22d3ee);color:#022c22;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem}
.admin-user-info{flex:1;min-width:0}
.admin-user-name{font-size:.85rem;font-weight:800;color:var(--txt-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-user-meta{font-size:.6rem;font-weight:700;color:var(--txt-3);
  font-family:'JetBrains Mono',monospace;margin-top:.1rem}
.admin-user-meta b{color:var(--emerald-bright)}

.admin-pass-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem}
.admin-pass-row .driver-label{flex:none;margin:0;width:auto;font-size:.58rem}
.admin-pass-row .m-input{flex:1;font-size:.78rem;padding:.5rem .6rem;font-weight:700}
.admin-user-actions{display:flex;gap:.3rem}
.btn-view-user{flex:1;padding:.55rem;border-radius:.5rem;border:1px solid rgba(6,182,212,.45);
  background:rgba(6,182,212,.12);color:#22d3ee;font-family:inherit;font-size:.72rem;
  font-weight:800;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:.3rem}
.btn-view-user:active{transform:scale(.97);background:rgba(6,182,212,.22)}
.btn-view-user svg{width:.85rem;height:.85rem}

.add-user-form{padding:.75rem;border-radius:.8rem;
  background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(6,182,212,.05));
  border:1.5px dashed rgba(16,185,129,.5);margin-top:.5rem}
.add-user-form .add-head{font-size:.75rem;font-weight:800;color:var(--emerald-bright);
  margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem}
.add-user-form .add-head svg{width:.95rem;height:.95rem}
.btn-create{width:100%;padding:.8rem;border-radius:.65rem;border:none;
  background:linear-gradient(135deg,#10b981,#06b6d4);color:#022c22;font-family:inherit;
  font-size:.85rem;font-weight:800;cursor:pointer;transition:all .18s;margin-top:.5rem;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  box-shadow:0 6px 18px -6px rgba(16,185,129,.6)}
.btn-create:active{transform:scale(.97)}
.btn-create svg{width:1rem;height:1rem}

/* ADMIN OVERVIEW STATS */
.ov-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem;margin-bottom:.55rem}
.ov-stat{padding:.75rem;border-radius:.8rem;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:.25rem;position:relative;overflow:hidden}
.ov-stat::before{content:'';position:absolute;top:-40%;right:-30%;width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,rgba(16,185,129,.18),transparent 70%);pointer-events:none}
.ov-stat-ico{font-size:1.1rem;margin-bottom:.1rem}
.ov-stat-val{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:1.25rem;
  color:var(--txt-1);letter-spacing:-.03em;line-height:1}
.ov-stat-label{font-size:.58rem;font-weight:700;color:var(--txt-3);
  text-transform:uppercase;letter-spacing:.06em}
.ov-stat.green .ov-stat-val{color:var(--emerald-bright)}
.ov-stat.violet .ov-stat-val{color:#a78bfa}
.ov-stat.cyan .ov-stat-val{color:#22d3ee}
.ov-stat.amber .ov-stat-val{color:#fbbf24}

.ov-user-row{display:flex;align-items:center;gap:.55rem;padding:.6rem .7rem;
  border-radius:.7rem;background:var(--surface);border:1px solid var(--line);
  margin-bottom:.4rem;cursor:pointer;transition:all .15s}
.ov-user-row:active{transform:scale(.985);background:var(--bg-2)}
.ov-user-av{flex:none;width:2.2rem;height:2.2rem;border-radius:.6rem;
  background:linear-gradient(135deg,#06b6d4,#22d3ee);color:#022c22;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem}
.ov-user-info{flex:1;min-width:0}
.ov-user-name{font-size:.82rem;font-weight:800;color:var(--txt-1);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ov-user-sub{font-size:.6rem;color:var(--txt-3);font-family:'JetBrains Mono',monospace;margin-top:.1rem}
.ov-user-sub b{color:var(--emerald-bright)}
.ov-user-arrow{flex:none;color:var(--txt-4)}
.ov-user-arrow svg{width:.95rem;height:.95rem}

/* SHEET */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:35rem;margin:0 auto;background:var(--bg-1);
  border-top-left-radius:1.25rem;border-top-right-radius:1.25rem;border-top:1px solid var(--line);
  padding:.5rem 0 env(safe-area-inset-bottom);transform:translateY(100%);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:50;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.5);font-size:1rem}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:2.2rem;height:.24rem;border-radius:999px;background:var(--surface-3);
  margin:.4rem auto .55rem;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:0 1rem .65rem;
  border-bottom:1px solid var(--line);flex:none}
.sheet-title{font-size:.92rem;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{padding:.75rem 1rem 1.25rem;overflow-y:auto;flex:1}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-label{display:block;font-size:.62rem;font-weight:700;color:var(--txt-3);
  margin:.7rem 0 .3rem;letter-spacing:.02em;text-transform:uppercase}
.sheet-label:first-child{margin-top:0}
.quick-btn{display:inline-flex;padding:.4rem .7rem;border-radius:.55rem;background:var(--surface-2);
  border:1px solid var(--line);color:var(--txt-2);font-size:.72rem;font-weight:700;cursor:pointer;
  margin:.2rem .3rem .2rem 0;transition:all .15s;font-family:inherit}
.quick-btn:active{transform:scale(.95);background:var(--surface-3)}
.sheet-actions{display:flex;gap:.4rem;margin-top:1rem;flex-wrap:wrap}
.btn{flex:1;min-width:0;padding:.75rem;border-radius:.7rem;border:none;font-family:inherit;font-size:.82rem;
  font-weight:800;cursor:pointer;transition:all .18s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#10b981,#06b6d4);color:#022c22;
  box-shadow:0 6px 18px -6px rgba(16,185,129,.6)}
.btn-danger{background:rgba(244,63,94,.15);color:var(--rose-bright);border:1.5px solid rgba(244,63,94,.4)}
.btn-call{background:linear-gradient(135deg,#06b6d4,#22d3ee);color:#022c22;width:100%;
  margin-bottom:.4rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.btn-call svg{width:.95rem;height:.95rem}
.btn-holiday{width:100%;padding:.7rem;border-radius:.7rem;border:1.5px solid rgba(139,92,246,.4);
  background:rgba(139,92,246,.1);color:#a78bfa;font-family:inherit;font-size:.78rem;font-weight:800;
  cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:.4rem;
  margin-top:.4rem}
.btn-holiday:active{transform:scale(.97)}
.btn-holiday.on{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(139,92,246,.15));
  border-color:rgba(139,92,246,.6);color:#c4b5fd}
.btn-holiday svg{width:1rem;height:1rem}

.auth-screen{position:absolute;inset:0;z-index:100;background:var(--bg);display:none;
  overflow-y:auto;padding:1.25em;font-size:16px}
.auth-screen.show{display:block}
.auth-card{max-width:22em;margin:0 auto;padding:10vh 0 3em}
.auth-logo{width:5em;height:5em;border-radius:1.4em;margin:0 auto 1.1em;
  background:linear-gradient(135deg,#10b981,#06b6d4);display:flex;align-items:center;justify-content:center;
  box-shadow:0 16px 40px -12px rgba(16,185,129,.85);overflow:hidden}
.auth-logo svg{width:100%;height:100%}
.auth-title{font-size:2em;font-weight:900;text-align:center;letter-spacing:.2em;margin-bottom:.25em;
  background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;padding-left:.2em}
.auth-sub{font-size:.85em;font-weight:600;color:var(--txt-3);text-align:center;margin-bottom:1.6em}
.auth-card .m-input{font-size:1.05em;padding:.85em .95em;text-align:center;letter-spacing:.08em}
.auth-card .btn{margin-top:.85em;padding:1em;font-size:.95em;border-radius:.75em}
.auth-error{font-size:.78em;font-weight:700;color:var(--rose-bright);text-align:center;
  margin-top:.75em;min-height:1.1em;line-height:1.4}
.auth-hint{font-size:.7em;color:var(--txt-4);text-align:center;margin-top:1.6em;line-height:1.6}
.auth-hint b{color:var(--emerald-bright)}

.alert-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:1.25rem;z-index:70;opacity:0;pointer-events:none;transition:opacity .3s;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);font-size:1rem}
.alert-modal.show{opacity:1;pointer-events:auto}
.alert-box{width:100%;max-width:26rem;background:var(--bg-1);
  border:1.5px solid rgba(244,63,94,.5);border-radius:1.25rem;padding:1.15rem;
  box-shadow:0 25px 60px -10px rgba(0,0,0,.7);max-height:80vh;display:flex;flex-direction:column}
.alert-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;flex:none}
.alert-ico{flex:none;width:2.2rem;height:2.2rem;border-radius:.65rem;background:rgba(244,63,94,.2);
  color:var(--rose-bright);display:flex;align-items:center;justify-content:center;
  animation:alertShake 2s ease-in-out infinite}
@keyframes alertShake{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(12deg)}}
.alert-ico svg{width:1.2rem;height:1.2rem}
.alert-title{font-size:.92rem;font-weight:800;color:#fecaca;letter-spacing:-.01em}
.alert-sub{font-size:.65rem;font-weight:700;color:var(--txt-3);margin-top:.1rem}
.alert-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:.35rem;margin:.4rem 0 .7rem;
  padding-right:.25rem}
.alert-list::-webkit-scrollbar{width:4px}
.alert-list::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:2px}
.alert-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .65rem;border-radius:.65rem;
  background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.alert-item-av{flex:none;width:1.75rem;height:1.75rem;border-radius:.5rem;
  background:linear-gradient(135deg,rgba(244,63,94,.3),rgba(153,27,27,.25));color:#fca5a5;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.7rem}
.alert-item-info{flex:1;min-width:0}
.alert-item-name{font-size:.76rem;font-weight:800;color:var(--txt-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-item-meta{font-size:.6rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  color:var(--txt-3);margin-top:.05rem}
.alert-item-meta b{color:#fca5a5}
.alert-item-btn{flex:none;width:2rem;height:2rem;border-radius:.5rem;border:none;
  background:rgba(6,182,212,.15);color:var(--cyan);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0}
.alert-item-btn:active{transform:scale(.9)}
.alert-item-btn svg{width:.9rem;height:.9rem}
.alert-close{width:100%;padding:.75rem;border-radius:.75rem;border:none;
  background:linear-gradient(135deg,#f43f5e,#fb7185);color:#fff;font-family:inherit;
  font-size:.82rem;font-weight:800;cursor:pointer;transition:all .18s}
.alert-close:active{transform:scale(.97)}

.month-header{display:flex;align-items:center;gap:.4rem;padding:.4rem;border-radius:.8rem;
  background:var(--surface);border:1px solid var(--line);margin-bottom:.6rem}
.month-header-btn{flex:none;width:2.1rem;height:2.1rem;border-radius:.55rem;background:var(--surface-2);
  border:none;color:var(--txt-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.month-header-btn:active{transform:scale(.88)}
.month-header-btn svg{width:.95rem;height:.95rem}
.month-title{flex:1;text-align:center;font-weight:800;font-size:.88rem;letter-spacing:-.02em}
.month-title small{display:block;font-size:.62rem;font-weight:600;color:var(--txt-3);margin-top:.05rem}
.car-grid{padding:.55rem .4rem;border-radius:.8rem;background:var(--surface);border:1px solid var(--line);
  margin-bottom:.4rem}
.car-grid-head{display:flex;align-items:center;gap:.5rem;padding:0 .3rem .5rem;margin-bottom:.4rem;
  border-bottom:1px solid var(--line)}
.car-grid-num{flex:none;min-width:1.5rem;height:1.5rem;padding:0 .35rem;border-radius:.4rem;
  background:var(--surface-2);color:var(--txt-3);font-size:.65rem;font-weight:800;display:flex;
  align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace}
.car-grid-info{flex:1;min-width:0}
.car-grid-name{font-size:.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-grid-name.empty{color:var(--txt-3);font-weight:500;font-style:italic}
.car-grid-plate{font-size:.58rem;font-weight:800;font-family:'JetBrains Mono',monospace;
  letter-spacing:.05em;color:var(--txt-3);text-transform:uppercase;margin-top:.05rem}
.car-grid-progress{flex:none;font-size:.62rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  color:var(--txt-3);padding:.15rem .4rem;border-radius:.4rem;background:var(--surface-2)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:.2rem;padding:0 .1rem .25rem}
.weekday{text-align:center;font-size:.55rem;font-weight:800;color:var(--txt-4);text-transform:uppercase}
.weekday.weekend{color:#fb7185;opacity:.6}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.2rem}
.day-btn{aspect-ratio:1;min-height:2.1rem;border-radius:.5rem;background:var(--surface-2);
  border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;color:var(--txt-3);font-family:'JetBrains Mono',monospace;padding:.1rem;transition:all .15s}
.day-btn:active{transform:scale(.9)}
.day-btn.paid{background:linear-gradient(135deg,#10b981,#06b6d4);color:#022c22;border-color:#6ee7b7}
.day-btn.partial{background:linear-gradient(135deg,rgba(245,158,11,.35),rgba(245,158,11,.15));
  color:#fbbf24;border-color:rgba(245,158,11,.6)}
.day-btn.today{border-color:var(--emerald);background:rgba(16,185,129,.1);color:var(--emerald-bright)}
.day-btn.today.paid{background:linear-gradient(135deg,#10b981,#06b6d4);color:#022c22}
.day-btn.missed{background:rgba(153,27,27,.35);border-color:var(--rose);color:#fca5a5}
.day-btn.holiday{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.55);color:#a78bfa}
.day-btn.weekend:not(.paid):not(.partial):not(.missed):not(.today):not(.holiday){
  background:rgba(148,163,184,.06);color:var(--txt-4)}
.day-num{font-size:.7rem;font-weight:700;line-height:1}

.driver-card{padding:.75rem;border-radius:.8rem;background:var(--surface);border:1px solid var(--line);
  margin-bottom:.5rem;position:relative}
.driver-card-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
.driver-card-num{flex:none;width:1.7rem;height:1.7rem;border-radius:.5rem;
  background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(6,182,212,.15));
  color:var(--emerald-bright);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.72rem;font-family:'JetBrains Mono',monospace}
.driver-card-title{flex:1;font-size:.66rem;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.04em}
.driver-card-actions{display:flex;gap:.3rem;flex:none}
.driver-head-btn{width:1.75rem;height:1.75rem;border-radius:.45rem;border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;padding:0}
.driver-head-btn svg{width:.9rem;height:.9rem}
.driver-head-btn.call{background:rgba(6,182,212,.15);color:var(--cyan)}
.driver-head-btn.call:active{background:rgba(6,182,212,.3);transform:scale(.9)}
.driver-head-btn.call.disabled{opacity:.3;pointer-events:none}
.driver-head-btn.del{background:rgba(244,63,94,.15);color:var(--rose-bright)}
.driver-head-btn.del:active{background:rgba(244,63,94,.3);transform:scale(.9)}
.driver-input-wrap{margin-bottom:.5rem}
.driver-input-wrap:last-child{margin-bottom:0}
.driver-label{display:block;font-size:.6rem;font-weight:700;color:var(--txt-3);margin-bottom:.28rem;
  letter-spacing:.02em;text-transform:uppercase}
.m-input{width:100%;padding:.65rem .75rem;border-radius:.65rem;background:var(--surface-2);
  border:1.5px solid var(--line);color:var(--txt-1);font-size:.85rem;font-weight:600;font-family:inherit;
  outline:none;transition:all .2s ease;-webkit-appearance:none}
.m-input::placeholder{color:var(--txt-4);font-weight:500}

.add-driver{margin-top:.75rem;padding:.75rem;border-radius:.8rem;border:2px dashed var(--line-strong);

</style>

<script>
'use strict';

const DB_KEY      = 'autorent-db-v1';
const SESSION_KEY = 'autorent-session';
const LEGACY_KEY  = 'autorent-mobile-v10';
const THEME_KEY   = 'autorent-theme';
const ZOOM_KEY    = 'autorent-zoom';
const APP_VERSION = '1.3';

const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD_LONG=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WD_HEAD=['пн','вт','ср','чт','пт','сб','вс'];
const CUTOFF_HOUR = 23;
const ZOOM_MIN = 0.75;
const ZOOM_MAX = 2.00;

const now0 = new Date();
const state = {
  viewDate: new Date(now0.getFullYear(), now0.getMonth(), now0.getDate()),
  monthView:{year:now0.getFullYear(), month:now0.getMonth()},
  activeTab:'today',
  drivers:[],
  payments:{},
  holidays:{},
  theme:'dark',
  zoom: 1,
  alertShown:false
};
let dirty = false;
let clockTimer = null;
let db = null;
let session = null;

function uid(){ return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function normDriver(d){
  return { name:(d&&d.name)||'', phone:(d&&d.phone)||'', plate:(d&&d.plate)||'', amount:Number(d&&d.amount)||0 };
}
function migrateHolidays(h){
  const out={};
  Object.keys(h||{}).forEach(k=>{
    if(h[k]===true) out[k]={};
    else if(h[k] && typeof h[k]==='object') out[k]=h[k];
  });
  return out;
}
function emptyData(){ return {drivers:[], payments:{}, holidays:{}}; }

function loadDb(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) db = JSON.parse(raw);
  }catch(e){ db = null; }

  if(!db || typeof db!=='object'){
    db = { adminPass:'admin', adminData:emptyData(), users:{} };
    try{
      const raw = localStorage.getItem(LEGACY_KEY);
      if(raw){
        const p = JSON.parse(raw);
        db.adminData.drivers  = (p.drivers||[]).map(normDriver);
        db.adminData.payments = p.payments || {};
        db.adminData.holidays = migrateHolidays(p.holidays||{});
      }
    }catch(e){}
    saveDb();
  }

  db.adminPass = db.adminPass || 'admin';
  db.users     = db.users || {};
  db.adminData = db.adminData || emptyData();
  db.adminData.drivers  = (db.adminData.drivers||[]).map(normDriver);
  db.adminData.payments = db.adminData.payments || {};
  db.adminData.holidays = migrateHolidays(db.adminData.holidays||{});

  Object.keys(db.users).forEach(id=>{
    const u = db.users[id];
    u.id    = id;
    u.name  = u.name || '';
    u.pass  = u.pass || '';
    u.created = u.created || Date.now();
    u.data  = u.data || emptyData();
    u.data.drivers  = (u.data.drivers||[]).map(normDriver);
    u.data.payments = u.data.payments || {};
    u.data.holidays = migrateHolidays(u.data.holidays||{});
  });
}
function saveDb(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){ console.warn('saveDb', e); }
}
function dataStore(){
  if(!session) return null;
  if(session.type==='admin') return db.adminData;
  const u = db.users[session.id];
  if(!u) return null;
  u.data = u.data || emptyData();
  return u.data;
}
function currentUserLabel(){
  if(!session) return '—';
  if(session.type==='admin') return 'Администратор';
  const u = db.users[session.id];
  return (u && u.name && u.name.trim()) ? u.name.trim() : 'Мой профиль';
}

function applyZoom(z){
  z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(z*100)/100));
  state.zoom = z;
  document.documentElement.style.setProperty('--zoom', z);
  const pct = Math.round(z*100);

  const range = document.getElementById('zoomRange');
  if(range){
    range.value = pct;
    range.style.setProperty('--pct', ((pct - 75) / (200 - 75) * 100) + '%');
  }
  const val = document.getElementById('zoomVal');
  if(val) val.textContent = pct + '%';

  document.querySelectorAll('.scale-presets button').forEach(b=>{
    b.classList.toggle('on', +b.dataset.zoom === pct);
  });

  const aboutSub = document.getElementById('aboutSub');
  if(aboutSub) aboutSub.textContent = `v${APP_VERSION} · ${pct}% · ${state.theme}`;

  try{ localStorage.setItem(ZOOM_KEY, z); }catch(e){}
  return z;
}

function restoreSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s) return null;
    if(s.type === 'admin') return s;
    if(s.type === 'user' && db.users[s.id]) return s;
  }catch(e){}
  return null;
}
function setSession(s){
  session = s;
  if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else  localStorage.removeItem(SESSION_KEY);
}

function renderNav(){
  const nav = document.getElementById('navBar');
  if(!session){ nav.innerHTML=''; return; }
  const isAdmin = session.type === 'admin';

  if(isAdmin){
    nav.innerHTML = `
      <button class="nav-btn active" data-tab="adminOverview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg><span>Обзор</span>
      </button>
      <button class="nav-btn" data-tab="adminProfiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg><span>Профили</span>
      </button>
      <button class="nav-btn" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg><span>Настройки</span>
      </button>
    `;
  } else {
    nav.innerHTML = `
      <button class="nav-btn active" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg><span>Сегодня</span>
      </button>
      <button class="nav-btn" data-tab="month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>
        </svg><span>Месяц</span>
      </button>
      <button class="nav-btn" data-tab="drivers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg><span>Водители</span>
      </button>
      <button class="nav-btn" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg><span>Настройки</span>
      </button>
    `;
  }

  nav.querySelectorAll('.nav-btn').forEach(b=>{
    b.addEventListener('click', ()=>switchTab(b.dataset.tab));
  });
}

function startApp(){
  const ds = dataStore();
  if(!ds){ doLogout(); return; }

  state.drivers  = (ds.drivers||[]).map(normDriver);
  state.payments = ds.payments || {};
  state.holidays = ds.holidays || {};
  state.alertShown = false;

  document.getElementById('authScreen').classList.remove('show');
  renderNav();

  const isAdmin = session.type === 'admin';
  switchTab(isAdmin ? 'adminOverview' : 'today');
  renderDayNav();

  if(clockTimer) clearInterval(clockTimer);
  tickClock();
  clockTimer = setInterval(tickClock, 30000);

  if(!isAdmin) setTimeout(checkAndShowAlert, 700);
}

function doLogout(){
  setSession(null);
  session = null;
  state.drivers=[]; state.payments={}; state.holidays={};
  state.alertShown=false;
  dirty = false;
  document.getElementById('fabSave').classList.remove('show');
  closeSheet();
  document.getElementById('authPass').value = '';
  document.getElementById('authError').textContent = '';
  document.getElementById('navBar').innerHTML = '';
  document.getElementById('authScreen').classList.add('show');
  setTimeout(()=>{ try{ document.getElementById('authPass').focus(); }catch(e){} }, 250);
}

/* ═══ ВХОД: ТОЛЬКО ПО ПАРОЛЯМ, СОЗДАННЫМ АДМИНОМ ═══ */
function tryLogin(pass){
  pass = (pass||'').trim();
  if(!pass){
    document.getElementById('authError').textContent = 'Введите пароль';
    return;
  }

  // 1. Проверка пароля админа
  if(pass === db.adminPass){
    setSession({type:'admin'});
    startApp();
    showToast('Добро пожаловать, Администратор', 'success');
    return;
  }

  // 2. Поиск по профилям, созданным админом
  const u = Object.values(db.users).find(x => (x.pass||'') === pass);

  if(!u){
    // ⛔ Никакой авторегистрации — только ошибка
    document.getElementById('authError').innerHTML =
      'Неверный пароль<br><span style="font-size:.85em;opacity:.7">Обратитесь к администратору</span>';
    document.getElementById('authPass').value = '';
    document.getElementById('authPass').focus();
    return;
  }

  // 3. Вход в личный профиль
  setSession({type:'user', id:u.id});
  startApp();
  showToast('Добро пожаловать, ' + currentUserLabel(), 'success');
}

function persist(){
  const ds = dataStore();
  if(ds){
    ds.drivers  = state.drivers;
    ds.payments = state.payments;
    ds.holidays = state.holidays;
    saveDb();
  }
  dirty = false;
  document.getElementById('fabSave').classList.remove('show');
}
function markDirty(){
  dirty = true;
  document.getElementById('fabSave').classList.add('show');
}

const pad = n => String(n).padStart(2,'0');
const dateKey = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const keyOfDate = dt => dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
const todayKey = () => keyOfDate(new Date());
const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
const firstWeekdayMon = (y,m) => { const d = new Date(y,m,1).getDay(); return d===0 ? 6 : d-1; };
function initials(n){
  if(!n || !n.trim()) return '—';
  const p = n.trim().split(/\s+/);
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}
function fmt(n){ return new Intl.NumberFormat('ru-RU').format(Math.round(n||0)); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, type='info'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}
function isPast(key){
  const today = new Date(); today.setHours(0,0,0,0);
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d) < today;
}
function isToday(key){ return key === todayKey(); }

function isHoliday(key, idx){
  const h = state.holidays[key];
  if(!h) return false;
  if(h === true) return true;
  return !!h[idx];
}
function toggleHoliday(key, idx){
  if(!state.holidays[key] || state.holidays[key] === true) state.holidays[key] = {};
  const day = state.holidays[key];
  if(day[idx]){
    delete day[idx];
    if(Object.keys(day).length === 0) delete state.holidays[key];
    showToast('Выходной отменён','info');
  } else {
    day[idx] = true;
    if(state.payments[key] && state.payments[key][idx]) delete state.payments[key][idx];
    showToast('Выходной отмечен','success');
  }
  markDirty(); renderDayNav(); refreshActiveView();
}
function callDriver(idx){
  const drv = state.drivers[idx];
  if(!drv || !drv.phone || !drv.phone.trim()){ showToast('Телефон не указан','error'); return; }
  const clean = drv.phone.replace(/[^\d+]/g,'');
  if(!clean){ showToast('Телефон некорректный','error'); return; }
  window.location.href = 'tel:' + clean;
}
function getPay(key, idx){
  const day = state.payments[key];
  if(!day) return null;
  const v = day[idx];
  if(v === undefined || v === null) return null;
  if(typeof v === 'number') return {sum:v, comment:''};
  return v;
}
function computeDay(key){
  let plan=0, paid=0, paidCount=0, partialCount=0, holidayCount=0;
  state.drivers.forEach((drv,i)=>{
    if(isHoliday(key,i)){ holidayCount++; return; }
    const amt = Number(drv.amount)||0;
    const p = getPay(key,i);
    plan += amt;
    if(p && p.sum>0){
      paid += p.sum;
      if(amt>0 && p.sum>=amt) paidCount++;
      else if(amt>0 && p.sum<amt) partialCount++;
    }
  });
  return {plan, paid, remain:Math.max(0, plan-paid), paidCount, partialCount, holidayCount, total:state.drivers.length};
}
function quickPay(key, idx){
  if(isHoliday(key,idx)){ showToast('У него выходной','info'); return; }
  const drv = state.drivers[idx];
  const amt = Number(drv.amount)||0;
  const existing = getPay(key,idx);
  if(!state.payments[key]) state.payments[key] = {};
  if(existing && amt>0 && existing.sum>=amt){
    delete state.payments[key][idx];
    markDirty(); refreshActiveView();
    showToast('Оплата отменена','info');
    return;
  }
  if(amt<=0){ openPaymentSheet(key, idx); return; }
  state.payments[key][idx] = {sum:amt, comment: existing ? existing.comment : ''};
  markDirty(); refreshActiveView();
  showToast('✓ Оплачено: ' + fmt(amt) + ' ֏','success');
}

function tickClock(){
  const d = new Date();
  const tEl = document.getElementById('clockTime');
  const dEl = document.getElementById('clockDate');
  if(!tEl) return;
  tEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  dEl.textContent = `${d.getDate()} ${MONTHS_GEN[d.getMonth()].slice(0,3)}`;
  tEl.classList.remove('warn','danger');
  const h = d.getHours();
  if(h >= CUTOFF_HOUR) tEl.classList.add('danger');
  else if(h >= 20) tEl.classList.add('warn');

  if(session && session.type !== 'admin'){
    if(h >= CUTOFF_HOUR && isToday(keyOfDate(state.viewDate))){
      const c = computeDay(todayKey());
      if(c.total>0 && c.paidCount + (c.holidayCount||0) < c.total){
        if(state.activeTab === 'today') renderToday();
      }
    }
    checkAndShowAlert();
  }
}

function shiftDay(delta){
  state.viewDate.setDate(state.viewDate.getDate()+delta);
  renderDayNav();
  if(state.activeTab==='today') renderToday();
}
function goToday(){
  state.viewDate = new Date();
  renderDayNav();
  if(state.activeTab==='today') renderToday();
}
function renderDayNav(){
  const d = state.viewDate;
  const key = keyOfDate(d);
  const label = document.getElementById('dayNavLabel');
  const sub = document.getElementById('dayNavSub');
  const isT = isToday(key);
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const tom  = new Date(); tom.setDate(tom.getDate()+1);
  let prefix = '';
  if(key === keyOfDate(yest)) prefix = 'Вчера · ';
  else if(key === keyOfDate(tom)) prefix = 'Завтра · ';
  label.textContent = `${prefix}${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
  label.classList.toggle('today', isT);
  const wd = WD_LONG[d.getDay()];
  sub.textContent = wd + (isT ? ' · сегодня' : '');
  sub.classList.toggle('today', isT);
}

    else if(paidSum>0 && amt>0 && paidSum<amt){
      amountLine = `<span class="sum">${fmt(paidSum)} / ${fmt(amt)} ֏</span><span style="color:#fbbf24">· ${fmt(amt-paidSum)}</span>`;
    } else if(paidSum>0){
      amountLine = `<span class="sum">${fmt(paidSum)} ֏</span>`;
    } else if(amt>0){
      amountLine = `<span class="sum">${fmt(amt)} ֏</span>`;
    }

    const plateHTML = drv.plate ? `<div class="pay-plate">🚗 ${escapeHtml(drv.plate)}</div>` : '';

    let qpCls = 'quick-pay', qpIcon = '';
    if(cls==='paid'){
      qpCls += ' on';
      qpIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    } else if(cls==='partial'){
      qpCls += ' partial';
      qpIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
    } else if(cls==='holiday'){
      qpIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18"/></svg>';
    } else {
      qpIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    }

    const hasPhone = drv.phone && drv.phone.trim();

    cardsHTML += `
      <div class="pay-card ${cls}">
        <div class="pay-main" data-open="${i}">
          <div class="pay-avatar">${initials(drv.name)}</div>
          <div class="pay-info">
            <div class="pay-name ${drv.name?'':'empty'}">${escapeHtml(drv.name||'Без имени')}</div>
            ${plateHTML}
            <div class="pay-amount">${amountLine}</div>
            ${comment ? `<div class="pay-comment">💬 ${escapeHtml(comment)}</div>` : ''}
          </div>
        </div>
        <div class="pay-actions">
          <button class="pay-action more-btn" data-more="${i}" aria-label="Детали">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
          </button>
          <button class="pay-action call-btn ${hasPhone?'':'disabled'}" data-call="${i}" aria-label="Позвонить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </button>
          <button class="pay-action holiday-btn ${holiday?'on':''}" data-hol="${i}" aria-label="Выходной">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <path d="M3 10h18M8 2v4M16 2v4"/>
              ${holiday?'<path d="M9 15l2 2 4-4"/>':''}
            </svg>
          </button>
          <button class="quick-pay ${qpCls.replace('quick-pay','').trim()}" data-qp="${i}" aria-label="Оплачено">
            ${qpIcon}
          </button>
        </div>
      </div>`;
  });

  let badges = '';
  if(isT) badges += `<span class="hero-badge today">сегодня</span>`;
  if(c.holidayCount>0) badges += `<span class="hero-badge holiday">вых: ${c.holidayCount}</span>`;

  el.innerHTML = `
    <div class="hero">
      <div class="hero-date">${day} ${MONTHS_GEN[m]} ${badges}</div>
      <div class="hero-body">
        <div class="progress-ring">
          <svg viewBox="0 0 80 80">
            <circle class="bg" cx="40" cy="40" r="36"/>
            <circle class="fg" cx="40" cy="40" r="36" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
          </svg>
          <div class="progress-ring-label">
            <div class="progress-ring-num">${pct}%</div>
            <div class="progress-ring-tot">${c.paidCount}/${payingTotal}</div>
          </div>
        </div>
        <div class="hero-info">
          <div class="hero-info-main">Собрано <b>${fmt(c.paid)}</b> ֏</div>
          <div class="hero-info-sub">${c.remain>0 ? 'Осталось: '+fmt(c.remain)+' ֏' : '✓ Всё собрано'}</div>
        </div>

      <div class="calc-row green"><span class="label">Оплачено</span><span class="value">${fmt(c.paid)} ֏</span></div>
      <div class="calc-row red"><span class="label">Остаток</span><span class="value">${fmt(c.remain)} ֏</span></div>
      ${c.holidayCount>0 ? `<div class="calc-row violet"><span class="label">Выходной</span><span class="value">${c.holidayCount}</span></div>` : ''}
      <div class="calc-row amber"><span class="label">Недоплатили</span><span class="value">${c.partialCount}</span></div>
      <div class="calc-row big"><span class="label">Оплатили полностью</span><span class="value">${c.paidCount} / ${payingTotal}</span></div>

  });

  el.querySelectorAll('.pay-action.holiday-btn').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); toggleHoliday(key, +b.dataset.hol); });
  });
  el.querySelectorAll('.quick-pay').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); quickPay(key, +b.dataset.qp); });
  });
}

function openPaymentSheet(key, idx){
  const drv = state.drivers[idx];
  if(!drv) return;
  const p = getPay(key,idx) || {sum:0, comment:''};
  const amt = Number(drv.amount)||0;
  const holiday = isHoliday(key,idx);
  const hasPhone = drv.phone && drv.phone.trim();

  const [y,m,d] = key.split('-').map(Number);
  const plateLine = drv.plate ? ` · ${drv.plate}` : '';
  document.getElementById('sheetTitle').textContent =
    `${d} ${MONTHS_GEN[m-1]} · ${drv.name||'Без имени'}${plateLine}`;

  document.getElementById('sheetBody').innerHTML = `
    ${holiday ? `<div style="padding:.55rem .7rem;border-radius:.6rem;background:rgba(139,92,246,.15);
      border:1px solid rgba(139,92,246,.4);color:#c4b5fd;font-size:.72rem;font-weight:700;
      margin-bottom:.6rem;text-align:center">🎉 У него выходной</div>` : ''}

    ${hasPhone ? `<button class="btn btn-call" id="btnCallSheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      Позвонить · ${escapeHtml(drv.phone)}
    </button>` : ''}

    <label class="sheet-label">Сумма оплаты (֏)</label>
    <input class="m-input mono" id="paySum" type="number" inputmode="numeric"
      value="${p.sum||''}" placeholder="0">

    ${amt>0 ? `<div style="display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem;">
      <button class="quick-btn" data-fill="${amt}">Полная: ${fmt(amt)}</button>
      <button class="quick-btn" data-fill="${Math.round(amt/2)}">Половина</button>
      <button class="quick-btn" data-fill="0">Очистить</button>
    </div>` : ''}

    <label class="sheet-label">Комментарий (если недоплатил)</label>
    <input class="m-input" id="payComment" type="text"
      value="${escapeHtml(p.comment||'')}" placeholder="Например: не хватило 5000, отдаст завтра">

    <button class="btn-holiday ${holiday?'on':''}" id="btnHolidaySheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        ${holiday ? '<path d="M20 6 9 17l-5-5"/>' : '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>'}
      </svg>
      ${holiday ? '✓ Выходной — отменить' : 'Отметить как выходной'}
    </button>

    <div class="sheet-actions">
      <button class="btn btn-danger" id="btnDelete">Удалить</button>
      <button class="btn btn-primary" id="btnSavePay">Сохранить</button>
    </div>
  `;

  document.querySelectorAll('#sheetBody .quick-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ document.getElementById('paySum').value = b.dataset.fill; });
  });
  const callBtn = document.getElementById('btnCallSheet');
  if(callBtn) callBtn.addEventListener('click', ()=>callDriver(idx));

  document.getElementById('btnDelete').addEventListener('click', ()=>{
    if(state.payments[key]) delete state.payments[key][idx];
    markDirty(); closeSheet(); refreshActiveView();
    showToast('Оплата удалена','info');
  });
  document.getElementById('btnHolidaySheet').addEventListener('click', ()=>{
    toggleHoliday(key, idx);
    closeSheet();
  });
  document.getElementById('btnSavePay').addEventListener('click', ()=>{
    const sum = Number(document.getElementById('paySum').value)||0;
    const comment = document.getElementById('payComment').value.trim();
    if(!state.payments[key]) state.payments[key] = {};
    if(sum===0 && !comment) delete state.payments[key][idx];
    else state.payments[key][idx] = {sum, comment};
    markDirty(); closeSheet(); refreshActiveView();
    showToast('Сохранено','success');
  });

  openSheet('sheet');
}

function renderMonth(){
  const el = document.getElementById('viewMonth');
  const {year, month} = state.monthView;
  const total = daysInMonth(year, month);
  const startWd = firstWeekdayMon(year, month);
  const tk = todayKey();

  if(state.drivers.length === 0){
    el.innerHTML = `<div class="empty"><div class="empty-icon">📅</div>
      <div class="empty-title">Нет водителей</div>
      <div class="empty-desc">Добавьте водителей, чтобы видеть календарь</div></div>`;
    return;
  }

  let wdHTML = '';
  WD_HEAD.forEach((w,i)=>{ wdHTML += `<div class="weekday ${i>=5?'weekend':''}">${w}</div>`; });

  let carsHTML = '';
  state.drivers.forEach((drv,i)=>{
    let sumCollected = 0;
    for(let d=1; d<=total; d++){
      const k = dateKey(year, month, d);
      const p = getPay(k,i);
      if(p && p.sum>0) sumCollected += p.sum;
    }
    let cells = '';
    for(let s=0; s<startWd; s++) cells += '<div></div>';
    for(let d=1; d<=total; d++){
      const k = dateKey(year, month, d);
      const holiday = isHoliday(k,i);
      const amt = holiday ? 0 : (Number(drv.amount)||0);
      const p = getPay(k,i);
      const s = p ? p.sum : 0;
      const isToday_ = k === tk;
      const wd = (startWd + d - 1) % 7;
      const isWeekend = wd >= 5;
      let cls = 'day-btn';
      if(holiday) cls += ' holiday';
      else if(amt>0 && s>=amt) cls += ' paid';
      else if(s>0 && amt>0 && s<amt) cls += ' partial';
      else if(amt>0 && s===0 && isPast(k)) cls += ' missed';
      if(isToday_) cls += ' today';
      if(isWeekend && !s && !isToday_ && !holiday) cls += ' weekend';
      cells += `<button class="${cls}" data-day="${d}" data-car="${i}"><span class="day-num">${d}</span></button>`;
    }
    carsHTML += `
      <div class="car-grid">
        <div class="car-grid-head">
          <div class="car-grid-num">${i+1}</div>
          <div class="car-grid-info">
            <div class="car-grid-name ${drv.name?'':'empty'}">${escapeHtml(drv.name||'Без имени')}</div>
            ${drv.plate ? `<div class="car-grid-plate">🚗 ${escapeHtml(drv.plate)}</div>` : ''}
          </div>
          <div class="car-grid-progress">${fmt(sumCollected)} ֏</div>
        </div>
        <div class="weekdays">${wdHTML}</div>
        <div class="days-grid">${cells}</div>
      </div>`;
  });

  let monthPlan = 0, monthPaid = 0;
  for(let d=1; d<=total; d++){
    const c = computeDay(dateKey(year, month, d));
    monthPlan += c.plan; monthPaid += c.paid;
  }

  el.innerHTML = `
    <div class="month-header">
      <button class="month-header-btn" id="prevMonth">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="month-title">${MONTHS[month]}<small>${year}</small></div>
      <button class="month-header-btn" id="nextMonth">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <div class="calc">
      <div class="calc-head">Калькулятор за ${MONTHS[month].toLowerCase()}</div>
      <div class="calc-row"><span class="label">План за месяц</span><span class="value">${fmt(monthPlan)} ֏</span></div>
      <div class="calc-row green"><span class="label">Собрано</span><span class="value">${fmt(monthPaid)} ֏</span></div>
      <div class="calc-row red"><span class="label">Остаток</span><span class="value">${fmt(Math.max(0, monthPlan-monthPaid))} ֏</span></div>
    </div>

    ${carsHTML}
  `;

  el.querySelector('#prevMonth').addEventListener('click', ()=>{
    state.monthView.month--;
    if(state.monthView.month < 0){ state.monthView.month = 11; state.monthView.year--; }
    renderMonth();
  });
  el.querySelector('#nextMonth').addEventListener('click', ()=>{
    state.monthView.month++;
    if(state.monthView.month > 11){ state.monthView.month = 0; state.monthView.year++; }
    renderMonth();
  });
  el.querySelectorAll('.day-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      openPaymentSheet(dateKey(year, month, +btn.dataset.day), +btn.dataset.car);
    });
  });
}

function renderDrivers(){
  const el = document.getElementById('viewDrivers');
  let html = '<div class="section-head"><div class="section-title">Водители · '+state.drivers.length+'</div></div>';

    state.drivers.forEach((drv,i)=>{

      html += `

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                </svg>
              </button>
            </div>
          </div>

            <input class="m-input" data-idx="${i}" data-field="name" value="${escapeHtml(drv.name||'')}" placeholder="Иванов Иван">

          <div class="driver-input-wrap">
            <label class="driver-label">Номер машины</label>
            <input class="m-input mono" data-idx="${i}" data-field="plate" value="${escapeHtml(drv.plate||'')}" placeholder="01 AB 123" style="text-transform:uppercase">
          </div>
          <div class="driver-input-wrap">
            <label class="driver-label">Телефон</label>
            <input class="m-input mono" data-idx="${i}" data-field="phone" value="${escapeHtml(drv.phone||'')}" placeholder="+374 XX XXX XXX" type="tel">
          </div>
          <div class="driver-input-wrap">
            <label class="driver-label">Сумма в день (֏)</label>
            <input class="m-input mono" data-idx="${i}" data-field="amount" type="number" inputmode="numeric"
              value="${drv.amount||''}" placeholder="0">
          </div>
        </div>`;
    });
  }

  html += `
    <button class="add-driver" id="addDriver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Добавить водителя
    </button>
    <div style="height:5rem"></div>`;

  el.innerHTML = html;

  el.querySelectorAll('.m-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const idx = +e.target.dataset.idx;
      const field = e.target.dataset.field;
      if(!state.drivers[idx]) return;
      if(field === 'amount') state.drivers[idx][field] = Number(e.target.value)||0;
      else if(field === 'plate') state.drivers[idx][field] = e.target.value.toUpperCase();
      else state.drivers[idx][field] = e.target.value;
      markDirty();
    });
  });
  el.querySelectorAll('[data-call-drv]').forEach(btn=>{
    btn.addEventListener('click', ()=>callDriver(+btn.dataset.callDrv));
  });
  el.querySelectorAll('.driver-head-btn.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.dataset.del;
      const d = state.drivers[idx];
      const label = d.plate ? `${d.name||'Без имени'} (${d.plate})` : (d.name||'Без имени');
      if(!confirm('Удалить водителя «'+label+'»?')) return;
      state.drivers.splice(idx,1);
      markDirty(); renderDrivers();
      showToast('Водитель удалён','info');
    });
  });
  el.querySelector('#addDriver').addEventListener('click', ()=>{
    state.drivers.push({name:'', phone:'', plate:'', amount:0});
    markDirty(); renderDrivers();
    setTimeout(()=>{
      const cards = document.querySelectorAll('#viewDrivers .driver-card');
      if(cards.length){
        const last = cards[cards.length-1];
        last.scrollIntoView({behavior:'smooth', block:'start'});
        const inp = last.querySelector('input');
        if(inp) inp.focus();
      }
    }, 60);
    showToast('Водитель добавлен','success');
  });
}

      renderAdminProfiles();
      showToast('Доступ удалён','info');

    btn.addEventListener('click', ()=>openUserSheet(btn.dataset.viewUser));
  });

function openUserSheet(userId){
  const u = db.users[userId];
  if(!u) return;
  const data = u.data || emptyData();
  const drivers = (data.drivers||[]).map(normDriver);

  let totalCollected = 0;
  Object.values(data.payments||{}).forEach(day=>{
    Object.values(day||{}).forEach(p=>{
      if(p && typeof p === 'object' && p.sum) totalCollected += Number(p.sum)||0;
      else if(typeof p === 'number') totalCollected += p;
    });
  });

  let totalPlan = 0;
  drivers.forEach(d=>{ totalPlan += Number(d.amount)||0; });

  let holidaysTotal = 0;
  Object.values(data.holidays||{}).forEach(day=>{
    if(day && typeof day === 'object') holidaysTotal += Object.keys(day).length;
  });

  const userName = (u.name && u.name.trim()) ? u.name.trim() : 'Без имени';
