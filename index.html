async function loadData(){
  var r=await Promise.all([
    sb.from('drivers').select('id,name,phone,plate,amount,position').order('position',{ascending:true}),
    sb.from('payments').select('driver_id,day,sum,comment'),
    sb.from('holidays').select('driver_id,day')
  ]);
  if(r[0].error||r[1].error||r[2].error) throw r[0].error||r[1].error||r[2].error;
  S.drivers=(r[0].data||[]).map(function(x){return{id:x.id,name:x.name||'',phone:x.phone||'',plate:x.plate||'',amount:Number(x.amount)||0};});
  S.pay={};(r[1].data||[]).forEach(function(x){if(!S.pay[x.day])S.pay[x.day]={};S.pay[x.day][x.driver_id]={sum:Number(x.sum)||0,comment:x.comment||''};});
  S.hol={};(r[2].data||[]).forEach(function(x){if(!S.hol[x.day])S.hol[x.day]={};S.hol[x.day][x.driver_id]=true;});
}

var isHol=function(k,id){return!!(S.hol[k]&&S.hol[k][id]);};
var beforeStart=function(k){return k < (S.profile&&S.profile.tracking_since ? S.profile.tracking_since : MIN_DATE);};

async function addDriver(){

async function updDriver(id,f,v){var pl={};pl[f]=v;var r=await sb.from('drivers').update(pl).eq('id',id);if(r.error)toast('Ошибка','er');}
async function delDriver(id){
  var r=await sb.from('drivers').delete().eq('id',id);
  if(r.error){toast('Ошибка','er');return;}
  var i=S.drivers.findIndex(function(d){return d.id===id;});
  if(i>=0)S.drivers.splice(i,1);
  Object.keys(S.pay).forEach(function(k){delete S.pay[k][id];});
  Object.keys(S.hol).forEach(function(k){delete S.hol[k][id];});
  renderDrivers();toast('Водитель удалён','info');
}
async function savePay(k,id,sum,comment){
  if(sum===0&&!comment){await delPay(k,id,true);return true;}
  var r=await sb.from('payments').upsert({owner_id:S.ownerId,driver_id:id,day:k,sum:sum,comment:comment,updated_at:new Date().toISOString()},{onConflict:'driver_id,day'});
  if(r.error){toast('Ошибка: '+r.error.message,'er');return false;}
  if(!S.pay[k])S.pay[k]={};
  S.pay[k][id]={sum:sum,comment:comment};
  return true;
}
async function delPay(k,id,sil){
  var r=await sb.from('payments').delete().eq('driver_id',id).eq('day',k);
  if(r.error){if(!sil)toast('Ошибка','er');return false;}
  if(S.pay[k])delete S.pay[k][id];
  return true;
}
async function toggleHol(k,id){
  var h=isHol(k,id);
  if(h){
    var r=await sb.from('holidays').delete().eq('driver_id',id).eq('day',k);
    if(r.error){toast('Ошибка','er');return;}
    if(S.hol[k])delete S.hol[k][id];
    toast('Выходной отменён','info');
  }else{
    var r2=await sb.from('holidays').insert({owner_id:S.ownerId,driver_id:id,day:k});
    if(r2.error){toast('Ошибка','er');return;}
    if(!S.hol[k])S.hol[k]={};
    S.hol[k][id]=true;
    if(S.pay[k]&&S.pay[k][id])await delPay(k,id,true);

function callDrv(id){
  var d=S.drivers.find(function(x){return x.id===id;});
  if(!d||!d.phone){toast('Телефон не указан','er');return;}
  var c=d.phone.replace(/[^\d+]/g,'');
  if(!c){toast('Телефон некорректный','er');return;}
  window.location.href='tel:'+c;
}

// Проверка "не оплачено и уже пора"
function isLate(k,drv){
  if(beforeStart(k)) return false;
  if(isHol(k,drv.id)) return false;
  var amt=Number(drv.amount)||0;
  if(amt<=0) return false;
  var p=getPay(k,drv.id);
  var paid=p?p.sum:0;
  if(paid>=amt) return false;
  // Прошлые дни (не сегодня) — значит уже долг
  var today=tk();
  if(k<today) return true;
  // Сегодня — проверяем время
  if(k===today){
    var nt=(S.profile&&S.profile.notify_time)||'20:00';
    var parts=nt.split(':');
    var nh=parseInt(parts[0])||20;
    var nm=parseInt(parts[1])||0;
    var now=new Date();
    var curMin=now.getHours()*60+now.getMinutes();
    var limMin=nh*60+nm;
    return curMin>=limMin;
  }
  return false;
}

function computeDay(k){
  var plan=0,paid=0,pc=0,pac=0,hc=0;
  S.drivers.forEach(function(d){
    if(isHol(k,d.id)){hc++;return;}
    var a=Number(d.amount)||0;
    var p=getPay(k,d.id);
    plan+=a;
    if(p&&p.sum>0){paid+=p.sum;if(a>0&&p.sum>=a)pc++;else if(a>0&&p.sum<a)pac++;}
  });
  return{plan:plan,paid:paid,remain:Math.max(0,plan-paid),paidCount:pc,partialCount:pac,holidayCount:hc,total:S.drivers.length};
}

async function quickPay(k,id){

  var drv=S.drivers.find(function(d){return d.id===id;});if(!drv)return;
  var a=Number(drv.amount)||0;

}

function renderMonth(){
  var el=$('vm');
  var year=S.mv.y,month=S.mv.m;
  var total=dim(year,month);var sw=fwm(year,month);var t=tk();
  if(S.drivers.length===0){el.innerHTML='<div class="em"><div class="emi">📅</div><div class="emt">Нет водителей</div></div>';return;}
  var wdH='';WH.forEach(function(w,i){wdH+='<div class="wd '+(i>=5?'we':'')+'">'+w+'</div>';});
  var ch='';
  S.drivers.forEach(function(drv,idx){
    var sc=0;
    for(var dd=1;dd<=total;dd++){var kk=dk(year,month,dd);if(beforeStart(kk))continue;var pp=getPay(kk,drv.id);if(pp&&pp.sum>0)sc+=pp.sum;}
    var cells='';
    for(var s=0;s<sw;s++)cells+='<div></div>';
    for(var d=1;d<=total;d++){
      var k=dk(year,month,d);
      if(beforeStart(k)){cells+='<button class="db2 off"><span class="dn2">'+d+'</span></button>';continue;}
      var h=isHol(k,drv.id);
      var a=h?0:(Number(drv.amount)||0);
      var p=getPay(k,drv.id);var s2=p?p.sum:0;
      var it=k===t;
      var wd=(sw+d-1)%7;var we=wd>=5;
      var cl='db2';
      if(h)cl+=' hol';
      else if(a>0&&s2>=a)cl+=' paid';
      else if(s2>0&&a>0&&s2<a)cl+=' partial';
      else if(a>0&&s2===0&&isPast(k))cl+=' missed';
      if(it)cl+=' today';
      if(we&&!s2&&!it&&!h)cl+=' we';
      cells+='<button class="'+cl+'" data-day="'+d+'" data-car="'+drv.id+'"><span class="dn2">'+d+'</span></button>';
    }
    ch+='<div class="cg"><div class="cgh"><div class="cgn">'+(idx+1)+'</div><div class="cgi"><div class="cgnm '+(drv.name?'':'e')+'">'+esc(drv.name||'Без имени')+'</div>'+(drv.plate?'<div class="cgp">🚗 '+esc(drv.plate)+'</div>':'')+'</div><div class="cgpr">'+fmt(sc)+' ֏</div></div><div class="wds">'+wdH+'</div><div class="dg">'+cells+'</div></div>';
  });
  var mp=0,mpaid=0;
  for(var d2=1;d2<=total;d2++){var kd=dk(year,month,d2);if(beforeStart(kd))continue;var c=computeDay(kd);mp+=c.plan;mpaid+=c.paid;}
  el.innerHTML='<div class="mh"><button class="mhb" id="pmb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="mt">'+MN[month]+'<small>'+year+'</small></div><button class="mhb" id="nmb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button></div><div class="calc"><div class="ch">Калькулятор за '+MN[month].toLowerCase()+'</div><div class="cr"><span class="lb">План за месяц</span><span class="vl">'+fmt(mp)+' ֏</span></div><div class="cr g"><span class="lb">Собрано</span><span class="vl">'+fmt(mpaid)+' ֏</span></div><div class="cr r"><span class="lb">Остаток</span><span class="vl">'+fmt(Math.max(0,mp-mpaid))+' ֏</span></div></div>'+ch;
  el.querySelector('#pmb').addEventListener('click',function(){S.mv.m--;if(S.mv.m<0){S.mv.m=11;S.mv.y--;}renderMonth();});
  el.querySelector('#nmb').addEventListener('click',function(){S.mv.m++;if(S.mv.m>11){S.mv.m=0;S.mv.y++;}renderMonth();});
  el.querySelectorAll('.db2:not(.off)').forEach(function(b){b.addEventListener('click',function(){openPaySheet(dk(year,month,+b.dataset.day),b.dataset.car);});});
}

function renderReport(){
  var el=$('vr');
  var year=S.mv.y,month=S.mv.m;
  var total=dim(year,month);
  var plan=0,paid=0,missedDays=0,paidDays=0,totalDays=0;
  var byDriver={};
  S.drivers.forEach(function(d){byDriver[d.id]={name:d.name,plate:d.plate,amount:Number(d.amount)||0,plan:0,paid:0,missed:0,days:0};});
  for(var d=1;d<=total;d++){
    var k=dk(year,month,d);
    if(beforeStart(k))continue;
    if(!isPast(k)&&k!==tk())continue; // только прошедшие + сегодня
    totalDays++;
    S.drivers.forEach(function(drv){
      if(isHol(k,drv.id))return;
      var amt=Number(drv.amount)||0;
      var p=getPay(k,drv.id);var s=p?p.sum:0;
      byDriver[drv.id].days++;
      byDriver[drv.id].plan+=amt;
      byDriver[drv.id].paid+=s;
      plan+=amt;paid+=s;
      if(s>=amt)paidDays++;
      else {missedDays++;byDriver[drv.id].missed++;}
    });
  }
  var rows='';
  S.drivers.forEach(function(drv){
    var b=byDriver[drv.id];
    if(b.days===0){rows+='<div style="padding:.5rem .6rem;border-radius:.6rem;background:var(--s2);border:1px solid var(--ln);margin-bottom:.35rem;font-size:.72rem"><b>'+esc(drv.name||'Без имени')+'</b> — нет данных</div>';return;}
    var miss=b.missed;
    rows+='<div style="padding:.6rem .7rem;border-radius:.6rem;background:var(--s2);border:1px solid var(--ln);margin-bottom:.35rem"><div style="display:flex;justify-content:space-between;margin-bottom:.3rem"><div style="font-size:.8rem;font-weight:800">'+esc(drv.name||'Без имени')+'</div><div style="font-family:JetBrains Mono,monospace;font-size:.72rem;color:var(--em2)">'+fmt(b.paid)+' / '+fmt(b.plan)+' ֏</div></div><div style="display:flex;justify-content:space-between;font-size:.62rem;color:var(--t3)"><div>Дней: <b style="color:var(--t2)">'+b.days+'</b></div><div>'+(miss>0?'<b style="color:#fca5a5">Не оплачено: '+miss+' дн.</b>':'<b style="color:var(--em2)">✓ Всё оплачено</b>')+'</div></div></div>';
  });
  el.innerHTML='<div class="mh"><button class="mhb" id="rpmb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="mt">Отчёт · '+MN[month]+'<small>'+year+'</small></div><button class="mhb" id="rnmb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button></div><div class="rep"><div class="cell g"><div class="lbl">Собрано</div><div class="val">'+fmt(paid)+'</div></div><div class="cell"><div class="lbl">План</div><div class="val">'+fmt(plan)+'</div></div><div class="cell r"><div class="lbl">Остаток</div><div class="val">'+fmt(Math.max(0,plan-paid))+'</div></div><div class="cell a"><div class="lbl">Не оплачено</div><div class="val">'+missedDays+' дн.</div></div></div><div class="sh"><div class="st">По водителям</div></div>'+rows+'<div style="height:5rem"></div>';
  el.querySelector('#rpmb').addEventListener('click',function(){S.mv.m--;if(S.mv.m<0){S.mv.m=11;S.mv.y--;}renderReport();});
  el.querySelector('#rnmb').addEventListener('click',function(){S.mv.m++;if(S.mv.m>11){S.mv.m=0;S.mv.y++;}renderReport();});
}

    sb.from('payments').select('driver_id,sum').eq('owner_id',uid),
    sb.from('holidays').select('driver_id').eq('owner_id',uid)
  ]);
  unload();
  var drvs=r2[0].data||[],pays=r2[1].data||[],hols=r2[2].data||[];
  var tc=pays.reduce(function(s,p){return s+(Number(p.sum)||0);},0);
  var tp=drvs.reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  var n=(profile.display_name&&profile.display_name.trim())?profile.display_name.trim():profile.username;
  $('ustT').textContent='👤 '+n;
  var dh='';
  if(drvs.length===0){dh='<div class="em" style="padding:1.2rem .5rem"><div class="emi" style="font-size:1.5rem">🚗</div><div class="emt" style="font-size:.75rem">Водителей нет</div></div>';}
  else drvs.forEach(function(drv){var paid=pays.filter(function(p){return p.driver_id===drv.id;}).reduce(function(s,p){return s+(Number(p.sum)||0);},0);dh+='<div style="display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border-radius:.6rem;background:var(--s2);border:1px solid var(--ln);margin-bottom:.35rem"><div style="flex:none;width:1.8rem;height:1.8rem;border-radius:.5rem;background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(6,182,212,.15));color:var(--em2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.65rem;font-family:JetBrains Mono,monospace">'+ini(drv.name)+'</div><div style="flex:1;min-width:0"><div style="font-size:.75rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(drv.name||'Без имени')+'</div><div style="font-size:.58rem;color:var(--t3);font-family:JetBrains Mono,monospace;margin-top:.05rem">'+(drv.plate?esc(drv.plate)+' · ':'')+fmt(Number(drv.amount)||0)+' ֏/день</div></div><div style="flex:none;font-family:JetBrains Mono,monospace;font-weight:800;font-size:.75rem;color:var(--em2)">'+fmt(paid)+' ֏</div></div>';});
  $('ustB').innerHTML='<div style="display:flex;align-items:center;gap:.7rem;padding:.7rem;border-radius:.7rem;background:linear-gradient(135deg,rgba(6,182,212,.12),rgba(16,185,129,.08));border:1px solid rgba(6,182,212,.35);margin-bottom:.7rem"><div style="flex:none;width:2.6rem;height:2.6rem;border-radius:.7rem;background:linear-gradient(135deg,#06b6d4,#22d3ee);color:#022c22;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem">'+ini(n)+'</div><div style="flex:1;min-width:0"><div style="font-size:.9rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(n)+'</div><div style="font-size:.6rem;font-family:JetBrains Mono,monospace;color:var(--t3);margin-top:.15rem">🔑 Пароль: <b style="color:var(--em2)">'+esc(profile.password||'—')+'</b></div></div></div><div class="rep"><div class="cell"><div class="lbl">Водителей</div><div class="val">'+drvs.length+'</div></div><div class="cell g"><div class="lbl">Собрано</div><div class="val">'+fmt(tc)+'</div></div><div class="cell"><div class="lbl">План/день</div><div class="val">'+fmt(tp)+'</div></div><div class="cell a"><div class="lbl">Выходных</div><div class="val">'+hols.length+'</div></div></div><label class="sl">Его водители</label>'+dh;
  openSheet('ust');
}

async function renderSettings(){
  var el=$('vs');
  if(!S.profile){el.innerHTML='<div class="em"><div class="emi">🔒</div></div>';return;}
  var p=Math.round(S.zoom*100);
  var n=(S.profile.display_name)||(S.profile.username)||'Пользователь';
  var ph;
  if(S.isAdmin){ph='<div class="ss"><div class="pm2"><div class="pav adm">👑</div><div class="pinf"><div class="pnm">Администратор</div><div class="prl">Полный доступ</div></div><div class="ptg adm">ADMIN</div></div></div>';}
  else{ph='<div class="ss"><div class="pm2"><div class="pav">'+ini(n)+'</div><div class="pinf"><div class="pnm">'+esc(n)+'</div><div class="prl">Личный профиль</div></div><div class="ptg usr">USER</div></div></div>';}
  var pwBlock='';
  if(!S.isAdmin){
    pwBlock='<div class="ss"><div class="ssh"><div class="ssi">🔑</div><div class="sst">Сменить пароль</div></div><div class="dw"><label class="dl">Текущий пароль</label><input class="mi mono" id="oldPw" type="password" placeholder="••••••"></div><div class="dw"><label class="dl">Новый пароль (мин. 6 символов)</label><input class="mi mono" id="newPw" type="password" placeholder="минимум 6"></div><button class="bcr" id="btnChPw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>Сменить пароль</button><div class="hm">После смены — используйте новый пароль для входа.</div></div>';
    pwBlock+='<div class="ss"><div class="ssh"><div class="ssi">⏰</div><div class="sst">Время уведомления</div></div><div class="sti">Напоминание об оплате</div><div class="sde">Если до этого времени водитель не оплачен — загорится красным и покажется уведомление</div><div class="nt"><input type="text" id="notifyTime" value="'+esc(S.profile.notify_time||'20:00')+'" placeholder="20:00" maxlength="5"></div><button class="bcr" id="btnNotif" style="margin-top:.6rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>Сохранить время</button><div class="hm">Формат: <b>ЧЧ:ММ</b> (например 20:00 или 21:30)</div></div>';
  }
  el.innerHTML=ph+'<div class="ss"><div class="ssh"><div class="ssi">📏</div><div class="sst">Размер интерфейса</div></div><div class="sti">Масштаб</div><div class="ssw"><input type="range" id="zoomRange" min="75" max="200" step="5" value="'+p+'"><div class="ssv" id="zoomVal">'+p+'%</div></div><div class="smk"><span>75%</span><span>100%</span><span>125%</span><span>150%</span><span>175%</span><span>200%</span></div><div class="spr">'+[75,100,125,150,175,200].map(function(v){return'<button data-zoom="'+v+'" class="'+(v===p?'on':'')+'">'+v+'%</button>';}).join('')+'</div></div><div class="ss"><div class="ssh"><div class="ssi">🎨</div><div class="sst">Внешний вид</div></div><div class="tr"><div><div class="sti">Тёмная тема</div><div class="sde">Переключить светлую/тёмную тему</div></div><button class="tg '+(S.theme==='dark'?'on':'')+'" id="ttg"></button></div></div>'+pwBlock+'<div class="ss dgr"><div class="ssh"><div class="ssi">🚪</div><div class="sst">Сессия</div></div><button class="bc" id="bout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Выйти из аккаунта</button></div><div class="ab"><div class="abt">SANI</div><div class="abs" id="aboutSub">v'+V+' · '+p+'% · '+S.theme+'</div></div><div style="height:5rem"></div>';
  $('zoomRange').addEventListener('input',function(e){applyZoom((+e.target.value)/100);});
  el.querySelectorAll('.spr button').forEach(function(b){b.addEventListener('click',function(){applyZoom((+b.dataset.zoom)/100);toast('Размер: '+b.dataset.zoom+'%','info');});});
  $('ttg').addEventListener('click',function(){var nt=S.theme==='dark'?'light':'dark';setTheme(nt);$('ttg').classList.toggle('on',nt==='dark');});
  $('bout').addEventListener('click',doLogout);
  if(!S.isAdmin){
    $('btnChPw').addEventListener('click',async function(){
      var oldP=$('oldPw').value;var newP=$('newPw').value;
      if(!oldP){toast('Введите текущий пароль','er');return;}
      if(!newP||newP.length<6){toast('Новый пароль мин. 6 символов','er');return;}
      if(oldP!==S.profile.password){toast('Текущий пароль неверный','er');return;}
      load('Смена пароля...');
      try{
        var ur=await sb.auth.updateUser({password:newP});
        if(ur.error){unload();toast('Ошибка: '+ur.error.message,'er');return;}
        var r=await sb.from('profiles').update({password:newP}).eq('id',S.profile.id);
        unload();
        if(r.error){toast('Ошибка сохранения','er');return;}
        S.profile.password=newP;
        toast('✓ Пароль изменён','su');
        $('oldPw').value='';$('newPw').value='';
      }catch(e){unload();toast('Ошибка сети','er');}
    });
    $('btnNotif').addEventListener('click',async function(){
      var t=$('notifyTime').value.trim();
      if(!/^\d{1,2}:\d{2}$/.test(t)){toast('Формат: ЧЧ:ММ','er');return;}
      var parts=t.split(':');
      var h=parseInt(parts[0]);var m=parseInt(parts[1]);
      if(h<0||h>23||m<0||m>59){toast('Некорректное время','er');return;}
      var fixed=pad(h)+':'+pad(m);
      var r=await sb.from('profiles').update({notify_time:fixed}).eq('id',S.profile.id);
      if(r.error){toast('Ошибка','er');return;}
      S.profile.notify_time=fixed;
      $('notifyTime').value=fixed;
      toast('✓ Сохранено: '+fixed,'su');
    });
  }
}

function checkAndShowAlert(){
  if(S.alertShown)return;
  var today=tk();
  var items=[];
  // Прошлые 7 дней
  for(var back=0;back<=7;back++){
    var dt=new Date();dt.setDate(dt.getDate()-back);
    var k=kod(dt);
    if(beforeStart(k))continue;
    S.drivers.forEach(function(drv){
      if(isLate(k,drv)){
        var p=getPay(k,drv.id);var paid=p?p.sum:0;
        var owed=(Number(drv.amount)||0)-paid;
        items.push({key:k,drv:drv,owed:owed,date:dt});
      }
    });
  }
  if(items.length===0)return;
  S.alertShown=true;
  $('alertSub').textContent=items.length+' запис'+(items.length===1?'ь':'ей');
  var list=$('alertList');list.innerHTML='';
  items.slice(0,20).forEach(function(it){
    var d=it.date;
    var el=document.createElement('div');
    el.className='alert-it';
    el.innerHTML='<div class="alert-av">'+ini(it.drv.name)+'</div><div class="alert-if"><div class="alert-n">'+esc(it.drv.name||'Без имени')+(it.drv.plate?' · '+esc(it.drv.plate):'')+'</div><div class="alert-mm">'+d.getDate()+' '+MG[d.getMonth()]+' · не оплачено <b>'+fmt(it.owed)+' ֏</b></div></div>';
    list.appendChild(el);
  });
  $('am').classList.add('on');
}

function init(){
  S.theme=localStorage.getItem('sani-theme')||'dark';
  document.documentElement.setAttribute('data-theme',S.theme);
  var z=parseFloat(localStorage.getItem('sani-zoom'));
  S.zoom=(!isNaN(z)&&z>=ZMIN&&z<=ZMAX)?z:1;
  applyZoom(S.zoom);
  on();
  $('bqt').addEventListener('click',function(){setTheme(S.theme==='dark'?'light':'dark');if(S.tab==='vs')renderSettings();});
  $('pd').addEventListener('click',function(){shiftDay(-1);});
  $('nd').addEventListener('click',function(){shiftDay(1);});
  $('dnc').addEventListener('click',goToday);
  $('shtC').addEventListener('click',closeSheet);
  $('sb').addEventListener('click',closeSheet);
  $('ustC').addEventListener('click',closeSheet);
  $('alertClose').addEventListener('click',function(){$('am').classList.remove('on');});
  $('ab').addEventListener('click',tryLogin);
  $('ap').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();tryLogin();}});
  $('ap').addEventListener('input',function(){$('aer').textContent='';});
  sb.auth.onAuthStateChange(function(event,session){
    if(event==='SIGNED_OUT'&&S.profile){showAuth();}
  });
  checkSession();
}
init();
</script>
