async function loadData(){var r=await Promise.all([sb.from('drivers').select('*').order('position',{ascending:true}),sb.from('payments').select('driver_id,day,sum,comment'),sb.from('holidays').select('driver_id,day')]);if(r[0].error||r[1].error||r[2].error)throw r[0].error||r[1].error||r[2].error;S.drivers=(r[0].data||[]).map(function(x){return{id:x.id,name:x.name||'',phone:x.phone||'',plate:x.plate||'',amount:Number(x.amount)||0,car_id:x.car_id||null,is_active:x.is_active!==false};});S.pay={};(r[1].data||[]).forEach(function(x){if(!S.pay[x.day])S.pay[x.day]={};S.pay[x.day][x.driver_id]={sum:Number(x.sum)||0,comment:x.comment||''};});S.hol={};(r[2].data||[]).forEach(function(x){if(!S.hol[x.day])S.hol[x.day]={};S.hol[x.day][x.driver_id]=true;});try{var cr=await sb.from('cars').select('*').order('position',{ascending:true});if(!cr.error&&cr.data){S.cars=cr.data.map(function(x){return{id:x.id,plate:x.plate||'',model:x.model||'',mileage:Number(x.mileage)||0,last_oil_date:x.last_oil_date,last_oil_mileage:Number(x.last_oil_mileage)||0,oil_interval:Number(x.oil_interval)||10000,insurance_start:x.insurance_start,insurance_until:x.insurance_until,tech_note:x.tech_note||''};});}}catch(e){S.cars=[];}await syncDriversToCars();}
async function syncDriversToCars(){var created=0;for(var i=0;i<S.drivers.length;i++){var drv=S.drivers[i];if(drv.car_id)continue;var plate=(drv.plate||'').trim();if(!plate)continue;var existing=S.cars.find(function(c){return (c.plate||'').toUpperCase()===plate.toUpperCase();});if(existing){drv.car_id=existing.id;await sb.from('drivers').update({car_id:existing.id}).eq('id',drv.id);continue;}var pos=S.cars.length;var ins=await sb.from('cars').insert({owner_id:S.ownerId,plate:plate.toUpperCase(),model:'',position:pos,oil_interval:10000}).select().single();if(!ins.error&&ins.data){S.cars.push({id:ins.data.id,plate:plate.toUpperCase(),model:'',mileage:0,last_oil_date:null,last_oil_mileage:0,oil_interval:10000,insurance_start:null,insurance_until:null,tech_note:''});drv.car_id=ins.data.id;await sb.from('drivers').update({car_id:ins.data.id}).eq('id',drv.id);created++;}}if(created>0)toast('🚗 '+tr('carAutoCreated')+': '+created,'su');}
var getPay=function(k,id){return S.pay[k]?S.pay[k][id]:null;};
var isHol=function(k,id){return!!(S.hol[k]&&S.hol[k][id]);};
var beforeStart=function(k){return k<(S.profile&&S.profile.tracking_since?S.profile.tracking_since:MIN_DATE);};
var getDriver=function(id){return S.drivers.find(function(d){return d.id===id;});};

function isLate(k,drv){if(!drv.is_active)return false;if(beforeStart(k))return false;if(isHol(k,drv.id))return false;var amt=Number(drv.amount)||0;if(amt<=0)return false;var p=getPay(k,drv.id);var paid=p?p.sum:0;if(paid>=amt)return false;var today=tk();if(k<today)return true;if(k===today){var nt=(S.profile&&S.profile.notify_time)||'20:00';var parts=nt.split(':');var nh=parseInt(parts[0])||20;var nm=parseInt(parts[1])||0;var now=new Date();var cur=now.getHours()*60+now.getMinutes();return cur>=nh*60+nm;}return false;}
